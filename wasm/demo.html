<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SLA sliceris naršyklėje - libslic3r/WASM</title>
<style>
  :root { color-scheme: light dark; --b: #d0d4da; --mut: #6b7280; --acc: #2563eb; }
  @media (prefers-color-scheme: dark) { :root { --b: #333a45; --mut: #9aa3af; --acc: #60a5fa; } }
  * { box-sizing: border-box; }
  body { font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--mut); margin: 0 0 20px; }
  .card { border: 1px solid var(--b); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  .row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
  label { display: flex; gap: 6px; align-items: center; }
  button { font: inherit; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--b);
           background: var(--acc); color: #fff; cursor: pointer; }
  button.antra { background: transparent; color: inherit; }
  button:disabled { opacity: .5; cursor: default; }
  input[type=number] { font: inherit; width: 5.5em; padding: 6px; border-radius: 6px; border: 1px solid var(--b); }
  #busena { margin: 12px 0 4px; color: var(--mut); }
  .juosta { height: 6px; background: rgba(127,127,127,.2); border-radius: 3px; overflow: hidden; }
  .juosta > i { display: block; height: 100%; width: 0; background: var(--acc); transition: width .2s; }
  table { border-collapse: collapse; width: 100%; }
  td { padding: 5px 10px 5px 0; border-bottom: 1px solid var(--b); }
  td:first-child { color: var(--mut); width: 42%; }
  .num { font-variant-numeric: tabular-nums; }
  pre { overflow-x: auto; background: rgba(127,127,127,.1); padding: 10px; border-radius: 8px; font-size: 13px; }
</style>
</head>
<body>

<h1>SLA sliceris naršyklėje</h1>
<p class="sub">Tikras PrusaSlicer atramų ir rafto variklis (<code>libslic3r</code>),
sukompiliuotas į WebAssembly. Viskas vyksta šitame kompiuteryje - modelis niekur nesiunčiamas.</p>

<div class="card">
  <div class="row">
    <label>Modelis: <input type="file" id="failas" accept=".stl"></label>
    <label>Sluoksnis: <input type="number" id="sluoksnis" value="0.05" step="0.01" min="0.01" max="0.5"> mm</label>
    <label><input type="radio" name="tipas" value="regular" checked> Įprastos atramos</label>
    <label><input type="radio" name="tipas" value="tree"> Medžio</label>
    <button id="pjaustyti" disabled>Pjaustyti</button>
    <button id="pavyzdys" class="antra" disabled>Paimti pavyzdį</button>
  </div>
  <div id="busena">Kraunamas variklis…</div>
  <div class="juosta"><i id="juosta"></i></div>
</div>

<div class="card" id="rezultatas" hidden>
  <table id="lentele"></table>
  <div class="row" style="margin-top:14px">
    <button id="sl1" class="antra">Pagaminti .sl1 printeriui</button>
    <span id="sl1busena" class="sub" style="margin:0"></span>
  </div>
</div>

<div class="card">
  <div class="sub">Neapdorotas atsakymas iš variklio:</div>
  <pre id="zalias">—</pre>
</div>

<script>
(function () {
  const busena = document.getElementById('busena');
  const juosta = document.getElementById('juosta');
  const mygtukas = document.getElementById('pjaustyti');
  const failas = document.getElementById('failas');
  const sl1Mygtukas = document.getElementById('sl1');
  let pasirinktas = null, paruostas = false;

  /* Variklis sukasi ATSKIROJE gijoje - kitaip 20 s pjaustymo langas butu
     uzsales: nei eigos matytum, nei mygtuko paspaustum. */
  const w = new Worker('worker.js');
  const kraunasi = performance.now();

  w.onmessage = function (ev) {
    const z = ev.data;
    if (z.tipas === 'paruostas') {
      paruostas = true;
      busena.textContent = 'Variklis paruoštas (' + Math.round(performance.now() - kraunasi) + ' ms).';
      document.getElementById('pavyzdys').disabled = false;
      mygtukas.disabled = !pasirinktas;

    } else if (z.tipas === 'eiga') {
      busena.textContent = z.etapas + '…';
      juosta.style.width = z.proc + '%';

    } else if (z.tipas === 'atsakymas') {
      rodyk(z.duomenys);

    } else if (z.tipas === 'sl1') {
      const mb = (z.baitai.byteLength / 1048576).toFixed(2);
      document.getElementById('sl1busena').textContent =
        z.vardas + ' · ' + z.info.sluoksniu + ' sluoksniai · ' + mb + ' MB · ' + z.info.laikas_ms + ' ms';
      window.__sl1 = new Uint8Array(z.baitai);   // is cia keliaus i printeri
      sl1Mygtukas.disabled = false;

    } else if (z.tipas === 'klaida') {
      busena.textContent = 'Klaida: ' + z.tekstas;
      mygtukas.disabled = false;
    }
  };

  failas.addEventListener('change', async function () {
    if (!failas.files.length) return;
    const f = failas.files[0];
    pasirinktas = { vardas: f.name, dydis: f.size, baitai: await f.arrayBuffer() };
    mygtukas.disabled = !paruostas;
    busena.textContent = 'Modelis paimtas: ' + f.name;
  });

  document.getElementById('pavyzdys').addEventListener('click', async function () {
    busena.textContent = 'Siunčiamas pavyzdys…';
    const r = await fetch('cup.stl');
    const b = await r.arrayBuffer();
    pasirinktas = { vardas: 'cup.stl', dydis: b.byteLength, baitai: b };
    mygtukas.disabled = !paruostas;
    busena.textContent = 'Pavyzdys paimtas (' + (b.byteLength / 1024).toFixed(0) + ' KB).';
  });

  mygtukas.addEventListener('click', function () {
    if (!pasirinktas || !paruostas) return;
    mygtukas.disabled = true;
    sl1Mygtukas.disabled = true;
    document.getElementById('sl1busena').textContent = '';
    juosta.style.width = '0';
    /* Kopija, nes originalo prireiks dar karta, jei naudotojas perjungs tipa. */
    const kopija = pasirinktas.baitai.slice(0);
    w.postMessage({
      tipas: 'pjaustyk', stl: kopija, vardas: pasirinktas.vardas,
      sluoksnis: parseFloat(document.getElementById('sluoksnis').value) || 0.05,
      medis: document.querySelector('input[name=tipas]:checked').value === 'tree',
    }, [kopija]);
  });

  sl1Mygtukas.addEventListener('click', function () {
    sl1Mygtukas.disabled = true;
    document.getElementById('sl1busena').textContent = 'gaminama…';
    w.postMessage({ tipas: 'sl1' });
  });

  function rodyk(r) {
    document.getElementById('zalias').textContent = JSON.stringify(r);
    const eil = [
      ['Failas', pasirinktas.vardas + ' · ' + (pasirinktas.dydis / 1048576).toFixed(1) + ' MB'],
      ['Trikampių', r.trikampiu.toLocaleString('lt')],
      ['Sluoksnių', r.sluoksniu.toLocaleString('lt')],
      ['Atramų tipas', r.tipas === 'tree' ? 'medžio' : 'įprastos'],
      ['Atramų taškų', r.tasku],
      ['Dervos iš viso', r.turis.viso_ml.toFixed(3) + ' ml'],
      ['&nbsp;&nbsp;atramoms ir raftui',
       ((r.turis.atramos + r.turis.padas) / 1000).toFixed(3) + ' ml'],
      ['Truko', (r.truko_ms / 1000).toFixed(1) + ' s'],
    ];
    document.getElementById('lentele').innerHTML =
      eil.map(function (p) { return '<tr><td>' + p[0] + '</td><td class="num">' + p[1] + '</td></tr>'; }).join('');
    document.getElementById('rezultatas').hidden = false;
    busena.textContent = 'Padaryta per ' + (r.truko_ms / 1000).toFixed(1) + ' s.';
    juosta.style.width = '100%';
    mygtukas.disabled = false;
    sl1Mygtukas.disabled = false;
  }
})();
</script>
</body>
</html>
