  <section id='slicerCard' class='card hidden'>
    <!-- Varnele - IS KARTO po pavadinimo (V 08-21): ji priklauso pavadinimui.
         Versijos piliules cia nebera (V 08-22): antrasteje ji atrode kaip busenos
         zenklas, nors yra tik prierasas, ir sedejo salia mygtuko, kuri reikia
         matyti pirma. Versija nusikele i korteles apacia desineje - ten, kur jos
         ieskoma tada, kai ji tikrai reikalinga. `slicerState` isnyko kartu su
         septyniu bakstelejimu gestu: kortele dabar rodoma tik tada, kai modulis
         gyvas, tad „not active" nebeturi kada suveikti. -->
    <div class='cardHead'><h2>STL slicer <button id='slicerToggle' class='button secondary'
              type='button' style='margin-top:0' aria-label='Open the slicer'>Open</button></h2></div>
    <div id='slicerBody' style='display:none'>
      <div id='slicerTools' class='toolbar' style='margin-top:0'>
        <button id='slicerAutoFit' class='button secondary' type='button' disabled
                title='Turn it, and scale only if it does not fit - answers at once'>Fast fit</button>
        <!-- Antras pastatymas: to paties darbo kruopstusis kelias. Atskiras mygtukas,
             o ne pakaitalas, nes jis skaiciuoja 10-15 s ir laimi ne visada. Kiek
             laimejo arba prarado - pasako eilute faktu sarase. -->
        <button id='slicerAutoFitPro' class='button secondary' type='button' disabled
                title='Optimal fit - PrusaSlicer looks for the tilt that needs the fewest supports. Takes 10-20 s on big models.'>Optimal fit</button>
        <button id='slicerFlat' class='button secondary' type='button' disabled
                title='Put the widest flat face down on the plate'>Lay flat</button>
        <button id='slicerFlip' class='button secondary' type='button' disabled
                title='Turn the model upside down'>Flip over</button>
        <button id='slicerRotX' class='button secondary' type='button' disabled
                title='Tilt forward a quarter turn'>Tilt 90°</button>
        <button id='slicerRotZ' class='button secondary' type='button' disabled
                title='Spin on the plate a quarter turn'>Rotate 90°</button>
      </div>
      <div id='slicerFit' style='display:none'></div>
      <!-- Mastelis ir minkstinimas gyvena ant vaizdo, salia modelio. -->
      <label style='display:none'><input type='checkbox' id='slicerAA' checked></label>

      <!-- Atramu tipas. Numatytosios - iprastos: jos patikimesnes, o medzio
           naudoja maziau dervos ir palieka maziau zymiu, bet ju raftas dar
           netikrintas ant gelezies. -->
      <!-- `nowrap`: `.calRow` pagal nutylejima laužo eilute, ir platus vardo laukas
           nusileisdavo i savo eilute. Vardas turi prasideti tuoj po „tree" ir eiti
           iki krasto - viena eilute, be tuscios vietos (V 08-20). -->
      <!-- NEMATOMA LENTELE: mygtuku eilute zemiau yra dvi lygios kolonos, tad ta pati
           lentele uzdeta ir cia - kaireje nustatymai, desineje vardas. Del to vardo
           lauko krastai stovi tiksliai ties „Send to printer" krastais, nors jokiu
           liniju nesimato (V 08-20: „nematoma lentele"). -->
      <div class='calRow' id='slicerSupRow'
           style='margin-top:6px;gap:8px;align-items:center;display:grid;grid-template-columns:1fr 1fr'>
        <div style='display:flex;align-items:center;gap:8px;min-width:0'>
        <span style='color:var(--muted);font-size:.9rem'>Supports</span>
        <label style='margin:0;display:inline-flex;align-items:center;gap:4px;cursor:pointer'>
          <input type='radio' name='slicerSupType' value='regular' checked> regular</label>
        <label style='margin:0;display:inline-flex;align-items:center;gap:4px;cursor:pointer'>
          <input type='radio' name='slicerSupType' value='tree'> tree</label>
        </div>
        <!-- Vardas - cia, o ne prie mygtuko: eilute su „Save to printer" isnyko, o
             vardas yra nustatymas, ne veiksmas (V 08-20).
             Plotis - iki pat korteles krasto: su 16 em riba lauko kairysis krastas
             sustodavo vidury tuscios vietos ir nestovedavo po niekuo (V 08-20). -->
        <!-- Jokio autocomplete: sarasas su anksciau vestais vardais nusileidzia
             tiesiai ant „Choose STL · Slice · Send" eilutes, o zmogus tuo metu
             ieško butent ju. Vardas cia ateina is failo, siulymo nereikia.
             Chrome i „off" atsizvelgia tik tada, kai lauko vardas jam nieko
             nesako - todel duotas savas (pultas laukeli ima pagal id). -->
        <input id='slicerName' type='text' placeholder='model name' maxlength='40'
               title='Letters, digits, - and _ . The printer screen shows about the first 14'
               name='tm-noac-name' autocomplete='off' autocorrect='off'
               autocapitalize='off' spellcheck='false' data-form-type='other'
               data-lpignore='true'
               style='width:100%;min-width:0;margin:0' disabled>
      </div>

      <!-- Trys zingsniai vienodo plocio: kelias matosi is pacios eilutes. -->
      <div class='calRow' style='margin-top:6px;gap:8px'>
        <label id='slicerChoose' class='button secondary step' style='margin:0;cursor:pointer;flex:1 1 0;min-width:0'>Choose STL
          <input type='file' id='slicerFile' accept='.stl' style='display:none'></label>
        <button id='slicerGo' class='button secondary' type='button' style='flex:1 1 0;min-width:0' disabled>Slice</button>
        <!-- Netelpanciam modeliui - TOJE PACIOJE vietoje, kur ieskoma „Slice".
             Uzrasas apacioje („too large - Fit it") sakė teisybe, bet akis tuo metu
             ziuri i uzrakinta mygtuka ir jo nemato (V 08-19). -->
        <button id='slicerFitNow' class='button secondary step' type='button'
                style='flex:1 1 0;min-width:0;display:none'
                title='Turn it, and scale only if it does not fit - answers at once'>Fast fit</button>
        <!-- Tas pats lizdas, trecias pavidalas: supjausčius kitas zingsnis yra
             issiuntimas, tad jis ir stovi ten, kur zmogus ka tik spaude. Atskiros
             eilutes su „Save to printer" nebereikia (V 08-20). -->
        <button id='slicerSend' class='button secondary step' type='button'
                style='flex:1 1 0;min-width:0;display:none'>Send to printer</button>
      </div>
      <!-- Rezultatas ir jo atsisakymas - ten, kur zmogus ka tik paspaude. -->
      <div class='calRow' style='margin:9px 0;gap:8px;min-height:1.9em;align-items:center'>
        <!-- „Discard" - DESINEJE, tiksliai po „Slice": is kaires krasto nesimatė,
             ko atsisakoma (V 08-20). Rezultato eilute uzleidzia jam ta stulpeli ir
             lieka kaireje - ji ir taip skaitoma is kaires. -->
        <span id='slicerProg' class='hint' style='flex:1 1 auto;text-align:left'></span>
        <a href='#' id='slicerDiscardLink'
           style='visibility:hidden;flex:0 0 auto;color:var(--link);font-size:.85rem'>Discard</a>
      </div>
      <!-- Pats siuntimo mygtukas lieka, tik nematomas: visa jo logika (vardai,
           perrasymas, eiga) sukasi cia, o „Send to printer" ji tik paspaudzia. -->
      <button id='slicerSave' type='button' style='display:none' disabled>Save to printer</button>
      <!-- Faktai - vienodais buletais: anksciau kiekviena eilute atrode kitaip,
           tad jos neatrode kaip vienas sarasas (V 08-12). -->
      <div id='slicerFacts'>
      <div id='slicerDims'></div>
      <div id='slicerInfo'>No file loaded yet.</div>
      <div>Layers are 0.05 mm, as for every model.</div>
      <div id='slicerSupports'>Supports and a raft are added on their own, wherever the part hangs - nothing to set.</div>
      <!-- Kruopstaus pastatymo verdiktas: ar jis siam modeliui geresnis uz greitaji.
           Be palyginimo skaicius nieko nesako - zmogus turi matyti, ka laimejo arba
           prarado, ir galeti grizti (V 08-20). -->
      <div id='slicerPlaceNote'></div>
      <div id='slicerIslands'></div>
      </div>
      <!-- Versija - apatiniame desiniame kampe, smulkiai ir tyliai (V 08-22).
           Reiksme ateina is `slicerMod.VERSION`, t. y. is PACIO uzsikrovusio
           modulio, o ne is `SV` konstantos kode: modulis ateina is tinklo,
           narsykle gali laikyti sena kese, ir 08-18 butent tas skirtumas
           kainavo puse dienos. -->
      <div id='slicerVerRow' style='text-align:right;margin-top:8px'><span id='slicerVer'
           style='font-size:11px;color:var(--muted2);letter-spacing:.02em'
           title='Slicer module version'></span></div>

    </div>
  </section>
