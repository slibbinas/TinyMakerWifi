<style>
/* Išdėstymas nešiojamo kompiuterio ekranui (~1440 × 660 naršyklės viduje):
   kairėje dervų sąrašas, viduryje derva ir bandymo forma, dešinėje eiga ir
   bandymai. Slenka tik stulpelis, ne visas puslapis (V 2026-09-18: „be dešros"). */
:root{color-scheme:light;
 --bg:#f3f4f6;--card:#fff;--line:#dcdfe5;--text:#1d1f24;--muted:#5b6270;--label:#2f3542;
 --accent:#e8720c;--accentbg:#fff4ea;--accentline:#f5c79f;--code:#eceef2;--link:#155fb0;--lab:#8a5cd6;
 --ok:#1f9d4d;--okbg:#e6f5ec;--warn:#a86b00;--warnbg:#fdf1dc;--bad:#c93b45;--badbg:#fbe7e8;--star:#d99a00;--diff:#fff0b3}
:root[data-theme=dark]{color-scheme:dark;
 --bg:#1b1b1e;--card:#25252a;--line:#3a3a41;--text:#ececef;--muted:#a0a0aa;--label:#d6d6dc;
 --accent:#e8720c;--accentbg:#3a2716;--accentline:#6b4220;--code:#303036;--link:#84bcf8;--lab:#a47ee8;
 --ok:#4cc46e;--okbg:#1d3326;--warn:#e0a44a;--warnbg:#33291a;--bad:#e2666e;--badbg:#3a2320;--star:#f0b429;--diff:#5a4a12}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.4 "Segoe UI",-apple-system,Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:6px 14px;background:var(--card);border-bottom:2px solid var(--accent)}
.brand{display:flex;align-items:center;gap:8px;color:var(--accent);font-size:20px;font-weight:700;margin:0;white-space:nowrap}
.brand .lab{font-size:11px;font-weight:600;color:#fff;background:var(--lab);border-radius:999px;padding:2px 9px}
header .dd{color:var(--muted);font-size:.72rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:60px}
.pchip{display:flex;align-items:center;gap:6px;font-size:.74rem;border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--bg);cursor:pointer;white-space:nowrap}
.pchip .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pchip.on .dot{background:var(--ok)}.pchip.busy .dot{background:var(--warn)}.pchip.off .dot{background:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:3px 8px;background:var(--card)}
.seg button.on{background:var(--accent);color:#fff}
#themeBtn{color:var(--muted);text-decoration:none;font-size:16px}
#topMsg{position:fixed;top:48px;right:16px;z-index:20;max-width:460px}
.app{flex:1;min-height:0;display:grid;grid-template-columns:230px minmax(420px,1fr) minmax(500px,1.25fr);gap:10px;padding:10px}
.col{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.card>h3{font-size:.82rem;margin:0 0 6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card>h3 .sp{flex:1}
.sec{font-size:.66rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:8px 0 3px;font-weight:700}
.list .it{display:block;width:100%;text-align:left;padding:6px 8px;border-radius:8px;border:1px solid transparent;background:none;margin:0 0 3px;cursor:pointer;font:inherit;color:inherit}
.list .it:hover{border-color:var(--line)}
.list .it.on{border-color:var(--accent);background:var(--accentbg)}
.list .it{white-space:normal}
.list .it b{display:block;font-size:.8rem;overflow-wrap:anywhere;line-height:1.25}
.list .it span{font-size:.7rem;color:var(--muted)}
button{font:inherit;font-size:.76rem;padding:3px 9px;border-radius:7px;border:1px solid var(--line);background:var(--code);color:var(--text);cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--accent)}
button.pri,button.cta{background:var(--accent);border-color:var(--accent);color:#fff}
button.cta{font-weight:600;padding:5px 12px}
button.dim{color:var(--muted)}
button.danger{color:var(--bad)}
button:disabled{opacity:.45;cursor:not-allowed}
.g{display:grid;gap:5px 8px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.full{grid-column:1/-1}
label{display:block;font-size:.69rem;color:var(--label);font-weight:600;min-width:0}
label>span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:1px}
input,select,textarea{width:100%;font:inherit;font-size:.8rem;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);font-weight:400}
input.bad{border-color:var(--bad);background:var(--badbg)}
textarea{resize:vertical}
.note{font-size:.72rem;color:var(--muted);margin:4px 0 0}
.k{color:var(--muted)}
.warn,.err,.okbox{border-radius:7px;padding:6px 9px;font-size:.76rem;margin:5px 0 0}
.warn{background:var(--warnbg);color:var(--warn)}.err{background:var(--badbg);color:var(--bad)}.okbox{background:var(--okbg);color:var(--ok)}
.chip{font-size:.66rem;padding:1px 7px;border-radius:999px;background:var(--code);color:var(--muted);white-space:nowrap}
.sumline{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:.76rem}.sumline b{font-weight:600}
.stars{color:var(--star);letter-spacing:1px;white-space:nowrap}
/* eiga */
.flow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;margin-top:8px}
.st{border:1px solid var(--line);border-radius:8px;padding:6px 6px 5px;font-size:.7rem;background:var(--bg);position:relative;cursor:pointer;min-height:48px}
.st b{display:block;font-size:.72rem;line-height:1.2;margin-bottom:2px}
.st .n{position:absolute;top:-7px;left:-5px;background:var(--muted);color:#fff;border-radius:50%;width:17px;height:17px;font-size:.62rem;display:flex;align-items:center;justify-content:center;font-weight:700}
.st.done{border-color:var(--ok);background:var(--okbg)}.st.done .n{background:var(--ok)}
.st.now{border:2px solid var(--accent);background:var(--accentbg)}.st.now .n{background:var(--accent)}
.st.sel{box-shadow:0 0 0 2px var(--accentline) inset}
.next{display:flex;gap:10px;align-items:center;margin-top:8px;padding:7px 9px;border-radius:8px;background:var(--accentbg);border:1px solid var(--accentline)}
.next .t{flex:1;font-size:.78rem}
/* modelio juosta */
.mstrip{display:flex;gap:8px;align-items:center;padding:5px;border:1px solid var(--line);border-radius:8px;background:var(--bg);margin-bottom:6px}
.mstrip img,.mstrip .mi{width:72px;height:54px;object-fit:contain;background:#f6f6f7;border-radius:5px;flex:none;display:flex;align-items:center;justify-content:center;font-size:.66rem;color:var(--muted)}
.mstrip .t{flex:1;font-size:.72rem;min-width:0}
.mstrip .acts{display:flex;flex-direction:column;gap:4px;align-items:stretch}
.jobline{font-size:.72rem;margin-top:4px}
/* bandymai */
.tl{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.tc{border:1px solid var(--line);border-radius:9px;background:var(--card);overflow:hidden;font-size:.72rem;display:flex;flex-direction:column}
.tc.best{border:2px solid var(--star)}
.tc.pick{box-shadow:0 0 0 2px var(--accent)}
.ph{height:118px;background:var(--code);display:flex;align-items:center;justify-content:center;color:var(--muted);position:relative;cursor:zoom-in}
.ph img{width:100%;height:100%;object-fit:cover}
.ph .badge{position:absolute;top:5px;left:5px;background:var(--star);color:#fff;border-radius:6px;padding:1px 6px;font-weight:700}
.ph .more{position:absolute;bottom:4px;right:6px;background:rgba(0,0,0,.5);color:#fff;border-radius:5px;padding:0 5px}
.tc .bd{padding:5px 7px;flex:1;display:flex;flex-direction:column;gap:2px}
.tc .bd .v{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.diff{background:var(--diff);border-radius:3px;padding:0 2px;font-weight:700}
.acts2{display:flex;gap:4px;margin-top:3px;flex-wrap:wrap}.acts2 button{font-size:.68rem;padding:2px 6px}
.cmp{display:grid;gap:8px}
.cmp .c{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card);font-size:.74rem}
.cmp .c.best{border:2px solid var(--star)}
.cmp .ph{height:200px}
.cmp table{width:100%;border-collapse:collapse}.cmp td{padding:2px 6px;border-top:1px solid var(--line)}
.cmp td:first-child{color:var(--muted)}
/* langai */
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:15;align-items:center;justify-content:center}
.ovl.on{display:flex}
.ovl .box{background:var(--card);border-radius:12px;width:min(1120px,95vw);max-height:90vh;display:flex;flex-direction:column;padding:12px 14px}
.ovl .box>h3{margin:0 0 4px;display:flex;gap:8px;align-items:center;font-size:.92rem}
.ovl .box>h3 .sp{flex:1}
.mgrid{overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;margin-top:8px}
.mc{border:1px solid var(--line);border-radius:9px;padding:6px;font-size:.72rem;background:var(--bg);display:flex;flex-direction:column;gap:4px}
.mc img{width:100%;height:120px;object-fit:contain;background:#f6f6f7;border-radius:6px}
.mc .nm{font-weight:600;font-size:.76rem;word-break:break-all}
.mc.nofit{opacity:.6}
.mc .types{display:flex;gap:4px 10px;flex-wrap:wrap}
.mc .types label{display:flex;gap:3px;align-items:center;font-weight:400}
.mc .types input{width:auto}
#viewer{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;z-index:25;align-items:center;justify-content:center;flex-direction:column;gap:8px}
#viewer.on{display:flex}
#viewer img{max-width:92vw;max-height:84vh;border-radius:6px}
#viewer .cap{color:#eee;font-size:.8rem}
#viewer .nav{position:absolute;top:50%;font-size:38px;color:#fff;cursor:pointer;user-select:none;padding:10px}
#viewer .prev{left:10px}#viewer .next2{right:10px}
#guide iframe{border:0;width:100%;height:78vh;border-radius:8px;background:var(--card)}
a{color:var(--link)}
@media(max-width:1180px){.app{grid-template-columns:200px 1fr}.col.c3{grid-column:2}}
</style>

class LabErr extends Error{constructor(code,detail){super(code);this.code=code;this.detail=detail||'';}}
async function api(path,opt){
  const r=await fetch(path,opt);
  let j=null;try{j=await r.json();}catch(e){}
  if(!r.ok)throw new LabErr((j&&j.error)||('http'),(j&&j.detail)||('HTTP '+r.status));
  return j;
}
const post=(path,obj)=>api(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj||{})});
function errText(e){
  if(e instanceof LabErr){const k='err_'+e.code;return T[LANG][k]?t(k,e.detail):t('err_other',e.detail||e.code);}
  return t('err_other',e.message||String(e));
}

let CAT=null,CFG={},list=[],cur=null,all={},MODELS=[],MAP={assign:{},notes:{},supports:{}},PR=null;

/* ---- pradiniai parametrai -------------------------------------------------
   Gamintojo skaičiai skirti mono ekranui arba RGB; TinyMaker spalvotas ekranas
   praleidžia mažiau UV, tad tiesiogiai jų imti negalima (README: jokių gamintojo
   reikšmių profilyje). Pradžios taškui - santykis „mūsų ištestuotas Regular /
   gamintojo intervalo vidurys" iš jau turimų dervų, padaugintas. Atidaryta derva
   į savo pačios santykį neįeina, kitaip pradžia atrodytų patvirtinta. */
function mid(range){
  const m=String(range||'').replace(/,/g,'.').match(/([\d.]+)\s*(?:-|–|to)?\s*([\d.]+)?/);
  if(!m)return null;
  const a=parseFloat(m[1]),b=m[2]?parseFloat(m[2]):a;
  return isFinite(a)&&isFinite(b)&&a>0?(a+b)/2:null;
}
function referenceSet(skip){
  const ref=(CAT.seeds.resins||[]).map(s=>({name:s.name,regular:s.regular,ds:{rgb_normal:s.rgb_normal,mono_normal:s.mono_normal}}));
  Object.values(all).forEach(r=>{
    if(r.slug===skip)return;
    const b=bestFor(r,0.05)||bestFor(r,0.1);
    if(!b||!r.datasheet||ref.some(x=>x.name===r.maker+' '+r.name))return;
    ref.push({name:r.maker+' '+r.name,regular:b.params.regular_exposure,ds:r.datasheet});
  });
  return ref;
}
function factor(col,skip){
  const ks=[],who=[];
  referenceSet(skip).forEach(x=>{const m=mid(x.ds&&x.ds[col]);if(m&&x.regular){ks.push(x.regular/m);who.push(x.name);}});
  if(!ks.length)return null;
  ks.sort((a,b)=>a-b);
  return {k:ks.length%2?ks[(ks.length-1)/2]:(ks[ks.length/2-1]+ks[ks.length/2])/2,who:who};
}
function suggest(r){
  const ds=r.datasheet||{};
  for(const col of ['rgb_normal','mono_normal']){
    const m=mid(ds[col]);if(!m)continue;
    const f=factor(col,r.slug);if(!f)continue;
    const fR=F.find(x=>x.k==='regular_exposure'),fB=F.find(x=>x.k==='base_exposure');
    const clamp=(v,fl)=>Math.min(fl.max,Math.max(fl.min,v));
    const reg=clamp(Math.round(m*f.k*2)/2,fR);
    const out={regular_exposure:reg,base_exposure:clamp(Math.round(reg*CAT.seeds.base_ratio),fB),
      why:(col==='rgb_normal'?'RGB':'Mono')+' '+num(m.toFixed(2))+' s × '+num(f.k.toFixed(2))+' ('+f.who.join(', ')+'); Base = Regular × '+num(CAT.seeds.base_ratio)};
    const d=parseFloat(String(ds.density||'').replace(',','.'));
    if(isFinite(d)&&d>=0.8&&d<=2)out.density=d;
    return out;
  }
  return null;
}

/* ---- bandymų pagalbinės ---------------------------------------------------- */
const key=(step,lh)=>step+'|'+Number(lh).toFixed(2);
const starsOf=tt=>tt.stars||({ok:4,part:3,bad:1}[tt.result]||0);  // seni įrašai turėjo tik „pavyko"
const starTxt=n=>'★★★★★'.slice(0,n)+'☆☆☆☆☆'.slice(0,5-n);
function testsIn(r,step,lh){return (r.tests||[]).filter(x=>x.step===step&&Number(x.layer_height)===Number(lh));}
function bestId(r,step,lh){return (r.best||{})[key(step,lh)]||null;}
function bestTest(r,step,lh){const id=bestId(r,step,lh);return id?(r.tests||[]).find(x=>x.id===id)||null:null;}
/* Profiliui imamas aukščiausio žingsnio ⭐ bandymas: sudėtingas modelis tikrina
   tuos pačius parametrus sunkesnėje vietoje, tad jo patikslinimas svarbesnis. */
function bestFor(r,lh){
  for(const st of ['complex','simple','coupon']){const b=bestTest(r,st,lh);if(b)return b;}
  return null;
}
function sortTests(r,ts){
  const bs=new Set(Object.values(r.best||{}));
  return ts.slice().sort((a,b)=>(bs.has(b.id)-bs.has(a.id))||(starsOf(b)-starsOf(a))||(String(b.date).localeCompare(String(a.date))));
}
const typeOf=r=>CAT.types.find(x=>x.id===r.type)||CAT.types[0];
// Paskelbtos dervos neišmetamos: jų profilis gyvena bibliotekoje (serveris tikrina tą patį).
const isPublished=r=>r.status==='paskelbta'||Object.keys(r.library||{}).length>0;
const stepOf=id=>CAT.steps.find(s=>s.id===id)||{};
function assigned(type,step){
  const a=MAP.assign||{},k=step==='coupon'?'*':type;
  return ((a[k]||{})[step]||[]).map(f=>MODELS.find(m=>m.file===f)||{file:f,missing:true});
}

async function loadList(open){
  list=await api('/api/lab/resins');
  const b=$('resList');b.innerHTML='';
  if(!list.length)b.textContent=t('noResins');
  list.forEach(x=>{
    const btn=document.createElement('button');btn.className='it'+(cur&&cur.slug===x.slug?' on':'');
    btn.innerHTML='<b>'+esc(x.broken?x.slug+' (!)':(x.maker+' '+x.name))+'</b><span>'+esc(t('st_'+(x.status||'laukiam')))+
      (x.tests?' · '+x.tests+' '+t('tests'):'')+'</span>';
    btn.addEventListener('click',()=>openResin(x.slug));
    b.appendChild(btn);
  });
  await Promise.all(list.filter(x=>!x.broken&&!all[x.slug]).map(async x=>{try{all[x.slug]=await api('/api/lab/resin/'+x.slug);}catch(e){}}));
  if(open)await openResin(open);
}
async function openResin(slug){
  try{cur=await api('/api/lab/resin/'+slug);all[slug]=cur;}catch(e){msg('err',errText(e));return;}
  editing=null;picks.clear();comparing=false;pending=[];keptPhotos=[];cur._edit=false;
  sel={step:nextStep(cur,0.05)||'coupon',lh:0.05,all:false};
  document.querySelectorAll('.list .it').forEach((b,i)=>b.classList.toggle('on',!!list[i]&&list[i].slug===slug));
  render();
}
async function persist(isNew){
  const body=Object.assign({},cur);delete body._edit;delete body._new;
  await api('/api/lab/resin/'+cur.slug,{method:'PUT',headers:{'Content-Type':'application/json','X-Lab-New':isNew?'1':'0'},body:JSON.stringify(body)});
  all[cur.slug]=cur;
}

  cur={slug:'',maker:'',name:'',type:'standard',color:'',source:'',received:'',wash:'',status:'laukiam',reason:'',notes:'',
    datasheet:{rgb_normal:'',mono_normal:'',rgb_bottom:'',mono_bottom:'',bottom_layers:'',density:''},tests:[],best:{},library:{},created:today(),_new:true,_edit:true};

/* ---- eiga -------------------------------------------------------------------
   Šeši žingsniai kiekvienam sluoksnio aukščiui. „Kitas veiksmas" - pirmas
   nepadarytas žingsnis, su mygtuku, kuris paruošia formą būtent jam. */
function flowState(r,lh){
  const has=(st)=>testsIn(r,st,lh).length;
  const hasModel=st=>assigned(r.type,st).length>0;
  const s=[];
  s[1]=!!(r.maker&&r.name&&((r.datasheet||{}).rgb_normal||(r.datasheet||{}).mono_normal));
  s[2]=has('vat')>0;
  s[3]=!!bestTest(r,'coupon',lh);
  s[4]=!!bestTest(r,'simple',lh)||testsIn(r,'simple',lh).some(x=>starsOf(x)>=4)||(!hasModel('simple')&&s[3]);
  s[5]=!!bestTest(r,'complex',lh)||testsIn(r,'complex',lh).some(x=>starsOf(x)>=4)||(!hasModel('complex')&&s[3]);
  s[6]=!!((r.library||{})[Number(lh).toFixed(2)]);
  return s;
}
function nextStep(r,lh){
  const s=flowState(r,lh);
  return !s[2]?'vat':!s[3]?'coupon':!s[4]?'simple':!s[5]?'complex':null;
}
function stepNote(r,lh,i){
  const ids=[null,null,'vat','coupon','simple','complex'];
  if(i===1)return flowState(r,lh)[1]?t('nDone'):t('nNone');
  if(i===6){const d=(r.library||{})[Number(lh).toFixed(2)],b=bestFor(r,lh);
    return d?t('nHanded',d):b?t('bestFrom',L(stepOf(b.step))):t('nNone');}
  const ts=testsIn(r,ids[i],lh),b=bestTest(r,ids[i],lh);
  if(b)return t('nBest',num(b.params.regular_exposure));
  if((i===4||i===5)&&!ts.length&&!assigned(r.type,ids[i]).length)return t('nSkip');
  if(!ts.length)return t('nNone');
  return i===3?t('nPickBest',ts.length):t('nTests',ts.length);
}

function paramLine(p,diffKeys){

const SHORT=fl=>({base_exposure:'Base',regular_exposure:'Regular',base_layers:t('bl'),transition_layers:LANG==='lt'?'Perėj.':'Trans.',
  slow_lift_distance:LANG==='lt'?'Lėt. kėl.':'Slow lift',fast_lift_distance:LANG==='lt'?'Greit. kėl.':'Fast lift',

function diffKeys(ts){
  const d=new Set();

  return d;
}

/* Naujo bandymo pradžia: to žingsnio ⭐ arba paskutinis; kitaip ankstesnio žingsnio ⭐;
   kitaip juostų testas; kitaip pradiniai. Tai ir yra „parametrai keliauja toliau". */
function defaultParams(step,lh){
  const r=cur,order=['vat','coupon','simple','complex'],i=order.indexOf(step);
  const own=bestTest(r,step,lh)||testsIn(r,step,lh).slice(-1)[0];
  if(own)return Object.assign({},own.params);
  for(let j=i-1;j>=1;j--){const b=bestTest(r,order[j],lh);if(b)return Object.assign({},b.params);}
  const v=testsIn(r,'vat',lh).slice(-1)[0];
  if(v)return Object.assign({},v.params);
  return startVals(lh);
}
function readParams(){
  const out={},bad=[];
  document.querySelectorAll('#tParams input').forEach(i=>{
    const f=F.find(x=>x.k===i.dataset.k),v=parseFloat(i.value);
    if(!(isFinite(v)&&v>=f.min&&v<=f.max))bad.push(SHORT(f));else out[f.k]=v;});
  return {out,bad};
}

      $('fReason').parentNode.hidden=r.status!=='netinka';
      if(r._new&&$('slugShow'))$('slugShow').textContent=slugify(r.maker+' '+r.name)||'-';
    };
    ['fMaker','fName','fColor','fType','fSource','fReceived','fWash','fStatus','fNotes','fReason','dsRgb','dsMono','dsRgbB','dsMonoB','dsBl','dsDen']
      .forEach(id=>{$(id).addEventListener('input',up);$(id).addEventListener('change',up);});
    $('fReason').parentNode.hidden=r.status!=='netinka';
    on('btnSave',async()=>{
      up();
      if(!r.maker||!r.name){$('saveMsg').textContent=t('needName');return;}
      const isNew=!!r._new;if(isNew)r.slug=slugify(r.maker+' '+r.name);
      try{await persist(isNew);r._new=false;r._edit=false;await loadList(r.slug);msg('okbox',t('saved'));}
      catch(e){$('saveMsg').textContent=errText(e);}
    });
    if(r._new)return;
  }
  // eiga
  document.querySelectorAll('#lhSeg button').forEach(b=>b.addEventListener('click',()=>{sel.lh=Number(b.dataset.lh);picks.clear();comparing=false;render();}));
  document.querySelectorAll('.st').forEach(b=>b.addEventListener('click',()=>{
    const i=Number(b.dataset.fi),ids=[null,null,'vat','coupon','simple','complex'];
    if(i===1){r._edit=true;render();return;}
    if(ids[i]){sel.step=ids[i];sel.all=false;editing=null;picks.clear();comparing=false;render();}}));
  on('btnNext',()=>{
    const a=$('btnNext').dataset.act;
    if(a==='editResin'){r._edit=true;render();}
    else if(a.startsWith('form:')){sel.step=a.slice(5);sel.all=false;editing=null;render();$('tParams').scrollIntoView({block:'nearest'});}
    else if(a.startsWith('compare:')){sel.step=a.slice(8);sel.all=false;testsIn(r,sel.step,sel.lh).forEach(x=>picks.add(x.id));comparing=true;render();}
    else if(a==='models')openModels();
    else if(a==='library')toLibrary();
  });
  on('btnInstall',installProfile);
  // bandymai
  on('btnAll',()=>{sel.all=!sel.all;comparing=false;render();});
  on('btnCompare',()=>{comparing=true;render();});
  on('btnBack',()=>{comparing=false;render();});
  document.querySelectorAll('[data-pick]').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.pick;picks.has(id)?picks.delete(id):picks.add(id);render();}));
  document.querySelectorAll('[data-best]').forEach(b=>b.addEventListener('click',()=>toggleBest(b.dataset.best)));
  document.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>{editing=b.dataset.edit;
    const x=r.tests.find(y=>y.id===editing);keptPhotos=(x.photos||[]).slice();pending=[];render();}));
  document.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',async()=>{
    const x=r.tests.find(y=>y.id===b.dataset.del);
    if(x&&await ask(t('delTestQ',L(stepOf(x.step))+', '+lhTxt(x.layer_height)+' mm',x.date),{yes:t('yes'),no:t('no')}))deleteTest(x.id);}));
  document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>openViewer(b.dataset.view)));
  // forma
  if(!$('tParams'))return;
  const ed=editing?(r.tests||[]).find(x=>x.id===editing):null;
  paramsForm(ed?ed.params:defaultParams(sel.step,sel.lh));
  $('tStep').addEventListener('change',()=>{if(editing)return;sel.step=$('tStep').value;sel.all=false;render();});
  $('tLh').addEventListener('change',()=>{if(editing)return;sel.lh=Number($('tLh').value);render();});
  on('btnFromSug',()=>paramsForm(startVals(Number($('tLh').value))));
  on('btnFromBest',()=>{const b=bestFor(r,Number($('tLh').value))||bestTest(r,$('tStep').value,Number($('tLh').value));if(b)paramsForm(b.params);});
  on('btnFromPrinter',fillFromPrinter);
  /* Sunaudota derva ir trukmė - tai, ką printeris skaičiavo per paskutinį spaudinį
     (/api/status resinUsedMl, runSecs); pildoma tik paspaudus, ne savaime. */
  on('btnMeasure',async()=>{
    try{const s=await api('/api/lab/printer');
      if(s.resinUsedMl!=null)$('mMl').value=Number(s.resinUsedMl).toFixed(2);
      if(s.runSecs!=null)$('mMin').value=Math.round(Number(s.runSecs)/60);}
    catch(e){msg('err',errText(e));}
  });
  on('btnCancelEdit',()=>{editing=null;keptPhotos=[];pending=[];render();});
  on('btnAssign',openModels);
  document.querySelectorAll('[data-run]').forEach(b=>b.addEventListener('click',()=>runOnPrinter(b.dataset.run)));
  document.querySelectorAll('[data-slice]').forEach(b=>b.addEventListener('click',()=>sliceOnly(b.dataset.slice)));
  const drop=$('drop'),fi=$('fileIn');
  const add=files=>{[...files].forEach(f=>{if(/^image\/(jpeg|png|webp)$/.test(f.type))pending.push({file:f,url:URL.createObjectURL(f)});});showPend();};
  drop.addEventListener('click',()=>fi.click());
  fi.addEventListener('change',()=>{add(fi.files);fi.value='';});
  drop.addEventListener('dragover',e=>{e.preventDefault();drop.style.borderColor='var(--accent)';});
  drop.addEventListener('dragleave',()=>{drop.style.borderColor='';});
  drop.addEventListener('drop',e=>{e.preventDefault();drop.style.borderColor='';add(e.dataTransfer.files);});
  document.onpaste=e=>{if(!$('drop'))return;const fs=[...((e.clipboardData||{}).items||[])].filter(i=>i.kind==='file').map(i=>i.getAsFile());if(fs.length)add(fs);};
  showPend();
  on('btnTest',saveTest);
}

/* ---- bandymo įrašymas, keitimas, trynimas ---------------------------------- */
const extOf=f=>f.type==='image/png'?'png':f.type==='image/webp'?'webp':'jpg';
async function saveTest(){
  const r=cur,{out,bad}=readParams();
  if(bad.length){$('testMsg').textContent=t('outOfRange',bad.join(', '));return;}
  const btn=$('btnTest');btn.disabled=true;$('testMsg').textContent='…';
  const ed=editing?r.tests.find(x=>x.id===editing):null;
  const x=ed||{id:Date.now().toString(36),photos:[]};
  const step=$('tStep').value,lh=Number($('tLh').value);
  Object.assign(x,{step:step,layer_height:lh,date:$('tDate').value||today(),stars:Number($('tStars').value),params:out,
    conditions:{room:$('cRoom').value,resin:$('cResin').value,wash:$('cWash').value.trim(),cure:$('cCure').value},
    measured:{ml:$('mMl').value,mins:$('mMin').value},verdict:$('tVerdict').value.trim()});
  delete x.result;
  if(!ed&&lastRun&&lastRun.step===step&&lastRun.lh===lh){x.model=lastRun.model;x.printed=lastRun.at;}
  try{
    const removed=ed?(ed.photos||[]).filter(n=>keptPhotos.indexOf(n)<0):[];
    const names=ed?keptPhotos.slice():[];
    for(let i=0;i<pending.length;i++){
      const f=pending[i].file,want=r.slug+'-'+x.date+'-'+step+'-'+String(lh).replace('.','')+'-'+(names.length+1)+'.'+extOf(f);
      const j=await api('/api/lab/photo/'+r.slug+'/'+encodeURIComponent(want),{method:'POST',body:f});
      names.push(j.name);
    }
    x.photos=names;
    if(!ed)r.tests=(r.tests||[]).concat([x]);
    if(r.status==='laukiam'||r.status==='gauta')r.status='testuojama';
    await persist(false);
    if(removed.length)await post('/api/lab/photo-delete/'+r.slug,{names:removed});
    if(!ed)lastRun=null;
    editing=null;pending=[];keptPhotos=[];sel.step=step;sel.lh=lh;
    await loadList(r.slug);sel={step:step,lh:lh,all:false};render();
    msg('okbox',t('testSaved'));
  }catch(e){btn.disabled=false;$('testMsg').textContent=errText(e);}
}
async function deleteTest(id){
  const r=cur,x=r.tests.find(y=>y.id===id);if(!x)return;
  r.tests=r.tests.filter(y=>y.id!==id);
  Object.keys(r.best||{}).forEach(k=>{if(r.best[k]===id)delete r.best[k];});
  picks.delete(id);if(editing===id)editing=null;
  try{await persist(false);if((x.photos||[]).length)await post('/api/lab/photo-delete/'+r.slug,{names:x.photos});render();}
  catch(e){msg('err',errText(e));}
}
async function toggleBest(id){
  const r=cur,x=r.tests.find(y=>y.id===id);if(!x)return;
  r.best=r.best||{};const k=key(x.step,x.layer_height);
  if(r.best[k]===id)delete r.best[k];else r.best[k]=id;
  try{await persist(false);render();}catch(e){msg('err',errText(e));}
}

/* ---- nuotraukų peržiūra ---------------------------------------------------- */
let VW={items:[],i:0};
function openViewer(id){
  const r=cur,ts=sel.all?r.tests:testsIn(r,sel.step,sel.lh);
  VW.items=[];ts.forEach(x=>(x.photos||[]).forEach(p=>VW.items.push({src:'/data/'+r.slug+'/photos/'+encodeURIComponent(p),
    cap:L(stepOf(x.step))+' · '+lhTxt(x.layer_height)+' mm · Regular '+num((x.params||{}).regular_exposure)+' s · '+starTxt(starsOf(x))+' · '+x.date,id:x.id})));
  if(!VW.items.length)return;
  VW.i=Math.max(0,VW.items.findIndex(v=>v.id===id));showViewer();$('viewer').classList.add('on');
}
function showViewer(){const v=VW.items[VW.i];$('viewer').querySelector('img').src=v.src;$('viewer').querySelector('.cap').textContent=v.cap+'  ('+(VW.i+1)+'/'+VW.items.length+')';}
$('viewer').addEventListener('click',e=>{
  if(e.target.classList.contains('prev')){VW.i=(VW.i-1+VW.items.length)%VW.items.length;showViewer();}
  else if(e.target.classList.contains('next2')){VW.i=(VW.i+1)%VW.items.length;showViewer();}
  else $('viewer').classList.remove('on');});
document.addEventListener('keydown',e=>{
  if(!$('viewer').classList.contains('on'))return;
  if(e.key==='ArrowLeft'){VW.i=(VW.i-1+VW.items.length)%VW.items.length;showViewer();}
  else if(e.key==='ArrowRight'){VW.i=(VW.i+1)%VW.items.length;showViewer();}
  else if(e.key==='Escape')$('viewer').classList.remove('on');});

/* Savas klausimo langas: naršyklės prompt/confirm atrodo kaip svetimas puslapis
   („localhost:8897 says"), o įrankis turi atrodyti kaip vienas produktas. */
function ask(text,{input=null,yes=t('save'),no=t('cancel')}={}){
  return new Promise(res=>{
    $('askText').textContent=text;$('askYes').textContent=yes;$('askNo').textContent=no;
    const i=$('askInput');i.hidden=input===null;i.value=input||'';
    const done=v=>{$('ask').classList.remove('on');$('askYes').onclick=$('askNo').onclick=null;i.onkeydown=null;res(v);};
    $('askYes').onclick=()=>done(input===null?true:i.value);$('askNo').onclick=()=>done(null);
    i.onkeydown=e=>{if(e.key==='Enter')done(i.value);if(e.key==='Escape')done(null);};
    $('ask').classList.add('on');if(input!==null)setTimeout(()=>i.focus(),30);
  });
}

async function refreshPrinter(){
  const c=$('pchip'),tx=$('pchipT');
  if(!CFG.printer){c.className='pchip';tx.textContent=t('pNone');PR=null;return;}
  try{PR=await api('/api/lab/printer');
    c.className='pchip '+(PR.busy?'busy':'on');
    tx.textContent=CFG.printer+' · '+(PR.busy?t('pBusy')+(PR.layerText?' '+PR.layerText:''):t('pIdle'))+(PR.prev&&!PR.busy?' · '+t('restore',PR.prev):'');
  }catch(e){PR=null;c.className='pchip off';tx.textContent=CFG.printer+' · '+t('pOff');}
}
$('pchip').addEventListener('click',async()=>{
  if(PR&&PR.prev&&!PR.busy&&await ask(t('restore',PR.prev)+'?',{yes:t('restore',PR.prev).replace('↩ ','')})){
    try{const j=await post('/api/lab/printer/restore');msg('okbox',t('restored',j.selected));}catch(e){msg('err',errText(e));}
    return refreshPrinter();
  }
  openSettings();
});
async function fillFromPrinter(){
  try{const j=await api('/api/lab/printer/current');paramsForm(Object.assign({},defaultParams(sel.step,sel.lh),j.values));}
  catch(e){msg('err',errText(e));}
}
async function waitJob(onStage){
  for(;;){
    await new Promise(res=>setTimeout(res,800));
    const j=await api('/api/lab/job');
    if(onStage)onStage(j.stage);
    if(j.done){if(j.error)throw new LabErr(j.error,j.detail);return j.result;}
  }
}
function jobLine(file,text,cls){
  const ms=assigned(cur.type,sel.step),i=ms.findIndex(m=>m.file===file),el=$('job'+i);
  if(el){el.className='jobline'+(cls?' '+cls:'');el.textContent=text;}
}
async function sliceOnly(file){
  try{await post('/api/lab/slice',{model:file,lh:sel.lh});jobLine(file,t('job_slice'));
    await waitJob();await reloadModels();render();}
  catch(e){jobLine(file,errText(e),'err');}
}
async function runOnPrinter(file){
  const {out,bad}=readParams();
  if(bad.length){$('testMsg').textContent=t('outOfRange',bad.join(', '));return;}
  const step=$('tStep').value,lh=Number($('tLh').value);
  try{
    await post('/api/lab/printer/run',{model:file,lh:lh,params:out,label:cur.maker+' '+cur.name});
    let res=await waitJob(st=>{if(st)jobLine(file,t('job_'+st));});
    if(res&&res.warning){
      if(!await ask(t('lowResin'),{yes:t('yesPrint')}))return jobLine(file,'');
      res=await post('/api/lab/printer/start',{name:res.name,force:1});
    }
    lastRun={model:file,step:step,lh:lh,at:new Date().toISOString()};
    jobLine(file,t('jobDone',res.name),'okbox');
    await reloadModels();refreshPrinter();
  }catch(e){jobLine(file,errText(e),'err');}
}
async function installProfile(){
  const r=cur,lh=sel.lh,b=bestFor(r,lh);if(!b)return;
  const base=slugify(r.maker+' '+r.name),slug=lh>0.075?base+'-010':base;
  try{await post('/api/lab/printer/install',{slug:slug,display:r.maker+' '+r.name+(lh>0.075?' 0.10':''),params:b.params,lh:lh,
    tested_by:'TinyMakerWiFi',tested_on:b.date.slice(0,7)});msg('okbox',t('installed',slug));}
  catch(e){msg('err',errText(e));}
}
async function toLibrary(){
  const r=cur,lh=sel.lh,b=bestFor(r,lh);if(!b)return;
  const base=slugify(r.maker+' '+r.name);
  const p=Object.assign({},b.params,{name:r.maker+' '+r.name,layer_height:lh,tested_by:'TinyMakerWiFi',tested_on:b.date.slice(0,7)});
  try{localStorage.setItem('tmResinLabHandoff',JSON.stringify({slug:lh>0.075?base+'-010':base,p:p}));}catch(e){msg('err',errText(e));return;}
  r.library=r.library||{};r.library[Number(lh).toFixed(2)]=today();
  try{await persist(false);}catch(e){msg('err',errText(e));}
  window.open('/resin-publish.html#lab','_blank');
  msg('okbox',t('libDone'));render();
}

/* ---- modelių sąranka ------------------------------------------------------- */
async function reloadModels(){
  const [m,map]=await Promise.all([api('/api/lab/models'),api('/api/lab/modelmap')]);
  MODELS=m.models;MAP=map;
}
function roleOf(file){
  const a=MAP.assign||{};
  if(((a['*']||{}).coupon||[]).indexOf(file)>=0)return {role:'coupon',types:[]};
  for(const st of ['simple','complex']){const ts=CAT.types.filter(x=>((a[x.id]||{})[st]||[]).indexOf(file)>=0).map(x=>x.id);if(ts.length)return {role:st,types:ts};}
  return {role:'',types:[]};
}
async function openModels(){
  try{await reloadModels();}catch(e){msg('err',errText(e));return;}
  $('mHelp').textContent=t('modelsHelp');
  const g=$('mGrid');g.innerHTML='';
  if(!MODELS.length)g.innerHTML='<div class="note">'+esc(t('noModels'))+'</div>';
  MODELS.forEach((x,idx)=>{
    const ro=roleOf(x.file),c=document.createElement('div');c.className='mc'+(x.fits===false?' nofit':'');
    c.innerHTML='<img src="/thumb/'+encodeURI(x.file)+'" alt="" loading="lazy"><div class="nm">'+esc(x.file)+'</div>'+
      '<div class="k">'+(x.broken?'!':esc((x.size||[]).map(num).join(' × '))+' mm · '+(x.tri||0).toLocaleString(LANG)+' '+t('tri'))+'</div>'+
      (x.fits===false?'<div class="warn" style="margin:0">'+esc(t('nofit')+(x.fits_any?t('nofitAny'):''))+'</div>':
      selBox('mr'+idx,t('useAs'),[['',t('u0')],['coupon',t('uC')],['simple',t('uS')],['complex',t('uX')]],ro.role)+
      '<div class="types" id="mt'+idx+'"'+(ro.role==='simple'||ro.role==='complex'?'':' hidden')+'><span class="k" style="width:100%">'+esc(t('forTypes'))+':</span>'+
        CAT.types.map(ty=>'<label><input type="checkbox" value="'+ty.id+'"'+(ro.types.indexOf(ty.id)>=0?' checked':'')+'>'+esc(L(ty))+'</label>').join('')+'</div>'+
      selBox('ms'+idx,t('supports'),[['0',t('sNo')],['1',t('sYes')]],MAP.supports&&MAP.supports[x.file]?'1':'0')+
      '<input id="mn'+idx+'" placeholder="'+esc(t('noteCheck'))+'" value="'+esc((MAP.notes||{})[x.file]||'')+'">');
    g.appendChild(c);
    const rs=$('mr'+idx);if(rs)rs.addEventListener('change',()=>{$('mt'+idx).hidden=!(rs.value==='simple'||rs.value==='complex');});

async function saveModels(){
  const A={},N={},S={};
  MODELS.forEach((x,idx)=>{
    const rs=$('mr'+idx);if(!rs)return;
    const role=rs.value;
    if(role==='coupon'){A['*']=A['*']||{};(A['*'].coupon=A['*'].coupon||[]).push(x.file);}
    else if(role){$('mt'+idx).querySelectorAll('input:checked').forEach(i=>{A[i.value]=A[i.value]||{};(A[i.value][role]=A[i.value][role]||[]).push(x.file);});}
    const n=$('mn'+idx).value.trim();if(n)N[x.file]=n;
    if($('ms'+idx).value==='1')S[x.file]=true;
  });
  try{await api('/api/lab/modelmap',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({assign:A,notes:N,supports:S})});
    await reloadModels();$('mMsg').textContent=t('saved');if(cur&&!cur._new)render();}
  catch(e){$('mMsg').textContent=errText(e);}
}

let SETV=null;
const SROWS=[['data_dir','sData','sDataH','dir'],['models_dir','sModels','sModelsH','dir'],

      (kind==='dir'?'<label id="cp_'+k+'" hidden style="display:flex;gap:4px;align-items:center;font-weight:400"><input type="checkbox" id="sc_'+k+'" checked style="width:auto">'+esc(t('sCopy'))+'</label>':'')+'</div></div>';
  }).join('')+'<div style="border-top:1px solid var(--line);padding-top:7px"><button data-open="local">'+esc(t('sLocal'))+'</button></div>';
  ['data_dir','models_dir'].forEach(k=>{const i=$('sv_'+k);i.addEventListener('input',()=>{

async function saveSettings(){
  const req={};SROWS.forEach(([k])=>{req[k]=$('sv_'+k).value.trim();});
  ['data_dir','models_dir'].forEach(k=>{req['copy_'+k]=!$('cp_'+k).hidden&&$('sc_'+k).checked;});
  const btn=$('sSave');btn.disabled=true;$('sMsg').textContent='…';
  try{
    let res=await api('/api/lab/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(req)});
    if(res.job)res=await waitJob(st=>{if(st){const [k,n]=st.split(' ');$('sMsg').textContent=t('job_'+k)+(n?' '+n:'');}});
    const n=Object.values(res.copied||{}).reduce((a,b)=>a+b,0);
    $('setdlg').classList.remove('on');
    CFG=await api('/api/lab/config');$('dataDir').textContent=t('data')+': '+CFG.data_dir;$('dataDir').title=CFG.data_dir+'\n'+CFG.models_dir;
    all={};cur=null;try{await reloadModels();}catch(e){}
    await loadList();render();refreshPrinter();
    msg('okbox',t('sSaved')+(n?' '+t('sCopied',n):''));
  }catch(e){$('sMsg').textContent=errText(e);}
  btn.disabled=false;
}
