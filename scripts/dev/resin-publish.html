<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-t="title"></title>
<style>
:root{color-scheme:light;
 --bg:#f7f7f8;--card:#fff;--line:#e3e5ea;--text:#1d1f24;--muted:#6b7280;
 --accent:#f07a1a;--code:#eef0f3;--link:#155fb0;
 --ok:#1f9d4d;--okbg:#e8f6ee;--warn:#b97a10;--warnbg:#fdf3e0;--bad:#d7454f;--badbg:#fdeaea}
:root[data-theme=dark]{color-scheme:dark;
 --bg:#1c1c1e;--card:#26262a;--line:#3a3a3f;--text:#eee;--muted:#9a9aa2;
 --accent:#e8720c;--code:#2f2f34;--link:#84bcf8;
 --ok:#4cc46e;--okbg:#1d3326;--warn:#e0a44a;--warnbg:#33291a;--bad:#e2666e;--badbg:#3a2320}
@media(prefers-color-scheme:dark){:root:not([data-theme]){color-scheme:dark;--bg:#1c1c1e;--card:#26262a;--line:#3a3a3f;--text:#eee;--muted:#9a9aa2;--accent:#e8720c;--code:#2f2f34;--link:#84bcf8;--ok:#4cc46e;--okbg:#1d3326;--warn:#e0a44a;--warnbg:#33291a;--bad:#e2666e;--badbg:#3a2320}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);padding:22px 16px 80px;
 font:15px/1.55 -apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1080px;margin:0 auto}
h1{font-size:1.35rem;margin:0 0 4px}
h1 .dot{color:var(--accent)}
.sub{color:var(--muted);font-size:.85rem;margin:0 0 16px;max-width:74ch}
.themeSw{float:right;display:inline-flex;gap:1px;align-items:center}
.themeSw button{background:none;border:0;padding:5px;margin:0;cursor:pointer;color:var(--muted);line-height:0;border-radius:7px}
.themeSw button svg{width:17px;height:17px;display:block;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.themeSw button:hover{color:var(--text)}
.themeSw button[aria-pressed=true]{color:var(--accent)}
#langSeg{float:right;margin-right:12px;border-radius:7px}
#langSeg button{padding:3px 8px;background:var(--card)}
#langSeg button.on{background:var(--accent)}
.rule{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);
 border-radius:10px;padding:11px 15px;margin:0 0 20px;font-size:.86rem}
h2{font-size:.76rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
 margin:26px 0 10px;font-weight:700}
.cols{display:grid;grid-template-columns:minmax(300px,1fr) minmax(340px,1.15fr);gap:18px;align-items:start}
/* Be min-width:0 grid'o stulpelis lieka platus kaip ilgiausias nelaužomas
   gabalas (mygtukų eilutė, ženkliukai) ir telefone atsiranda šoninis slinkimas. */
.cols>div{min-width:0}
@media(max-width:860px){.cols{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.row{display:flex;align-items:baseline;gap:10px;padding:9px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.row:first-of-type{border-top:0}
.row .nm{font-weight:600}
.row .sb{color:var(--muted);font-size:.8rem;flex:1 1 100%}
.row .acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;font-size:.82rem;padding:5px 11px;border-radius:8px;border:1px solid var(--line);
 background:var(--code);color:var(--text);cursor:pointer}
button:hover{border-color:var(--accent)}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
button.dim{color:var(--muted)}
button:disabled{opacity:.45;cursor:not-allowed;border-color:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 12px}
label{display:block;font-size:.78rem;color:var(--muted)}
label b{display:block;font-weight:600;color:var(--text);font-size:.82rem;margin-bottom:3px}
input[type=text],input[type=number],textarea{width:100%;font:inherit;font-size:.86rem;padding:6px 8px;
 border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--text)}
input.bad{border-color:var(--bad);background:var(--badbg)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 14px}
.seg button.on{background:var(--accent);color:#fff}
.note{font-size:.78rem;color:var(--muted);margin:6px 0 0}
.warn{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:8px 11px;font-size:.8rem;margin:8px 0 0}
.err{background:var(--badbg);color:var(--bad);border-radius:8px;padding:8px 11px;font-size:.8rem;margin:8px 0 0}
.okbox{background:var(--okbg);color:var(--ok);border-radius:8px;padding:8px 11px;font-size:.8rem;margin:8px 0 0}
pre{background:var(--code);border-radius:9px;padding:11px 13px;font-size:.78rem;overflow:auto;margin:8px 0 0;
 max-height:340px;line-height:1.5}
.tag{font-size:.7rem;padding:2px 7px;border-radius:999px;background:var(--code);color:var(--muted);white-space:nowrap}
.tag.no{background:var(--badbg);color:var(--bad)}
.tag.hid{background:var(--warnbg);color:var(--warn)}
details{margin-top:10px}summary{cursor:pointer;font-size:.8rem;color:var(--muted)}
.help{font-size:.85rem}
.help .lead{margin:0 0 4px;color:var(--muted)}
.help .sc{border-top:1px solid var(--line);padding:10px 0 2px}
.help .sc>b{display:block;margin-bottom:3px}
.help .sc span{display:block;color:var(--muted)}
.help i{font-style:normal;background:var(--code);border-radius:5px;padding:1px 5px;white-space:nowrap}
.foot{margin-top:26px;font-size:.78rem;color:var(--muted)}
a{color:var(--link)}
</style>
<div class="wrap">
<div class="themeSw" role="group" aria-label="Theme"><button data-m="system" title="System" aria-label="System theme"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg></button><button data-m="light" title="Light" aria-label="Light theme"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/></svg></button><button data-m="dark" title="Dark" aria-label="Dark theme"><svg viewBox="0 0 24 24"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8z"/></svg></button></div>
<span class="seg" id="langSeg"><button data-l="lt">LT</button><button data-l="en">EN</button></span>
<h1>TinyMaker <span class="dot">·</span> <span data-t="h1"></span></h1>
<p class="sub" data-th="sub"></p>

<div class="rule" data-th="rule"></div>

<div class="cols">
 <div>
  <h2 data-t="hLib"></h2>
  <div class="card" id="libCard">
   <div id="libBody" class="note"></div>
   <div class="row" style="border-top:1px solid var(--line);padding-top:10px">
    <button class="pri" id="btnNew" data-t="newResin"></button>
    <div class="acts">
     <button class="dim" id="btnReload" data-t="reload"></button>
     <button class="dim" id="btnPaste" data-t="paste"></button>
    </div>
   </div>
   <div id="pasteBox" style="display:none">
    <textarea id="pasteTa" rows="6" data-tp="pastePh"></textarea>
    <div class="row"><button id="btnPasteOk" data-t="load"></button><button class="dim" id="btnPasteCancel" data-t="cancel"></button></div>
   </div>
  </div>
  <div id="pending"></div>

  <h2 data-t="hHow"></h2>
  <div class="card help">
   <p class="lead" data-th="lead"></p>
   <div class="sc"><b data-t="s1t"></b><span data-th="s1b"></span></div>
   <div class="sc"><b data-t="s2t"></b><span data-th="s2b"></span></div>
   <div class="sc"><b data-t="s3t"></b><span data-th="s3b"></span></div>
   <div class="sc"><b data-t="s4t"></b><span data-th="s4b"></span></div>
   <div class="sc"><b data-t="s5t"></b><span data-th="s5b"></span></div>
   <div class="sc"><b data-t="s6t"></b><span data-th="s6b"></span></div>
   <div class="sc"><b data-t="s7t"></b><span data-th="s7b"></span></div>
   <div class="sc"><b data-t="s8t"></b><span data-th="s8b"></span></div>
  </div>
 </div>

 <div>
  <h2 id="formTitle"></h2>
  <div class="card">
   <div class="grid" style="grid-template-columns:1fr">
    <label><b data-t="lName"></b><input type="text" id="fDisplay" placeholder="Sunlu Toughness"></label>
   </div>
   <div class="grid" style="margin-top:10px">
    <label><b data-t="lSlug"></b><input type="text" id="fSlug" placeholder="sunlu-tough">
     <span style="font-size:.72rem;color:var(--muted)" data-t="slugHint"></span></label>
    <div><label><b data-t="lLh"></b></label>
     <div class="seg" id="lhSeg"><button data-lh="0.05"></button><button data-lh="0.10"></button></div></div>
   </div>
   <div id="fields" class="grid" style="margin-top:12px"></div>
   <div class="grid" style="margin-top:12px">
    <label><b data-t="lBy"></b><input type="text" id="fTestedBy" placeholder="TinyMakerWiFi"></label>
    <label><b data-t="lOn"></b><input type="text" id="fTestedOn" placeholder="2026-08"></label>
   </div>
   <div class="grid" style="grid-template-columns:1fr;margin-top:10px">
    <label><b data-t="lShop"></b><input type="text" id="fShop" placeholder="https://www.sunlu.com/">
     <span style="font-size:.72rem;color:var(--muted)" id="fBuyShow"></span></label>
   </div>
   <p class="note" data-th="shopNote"></p>
   <div id="formMsg"></div>
   <div class="row" style="border-top:1px solid var(--line);margin-top:12px;padding-top:11px">
    <button class="pri" id="btnApply" data-t="apply"></button>
    <div class="acts">
     <button id="btnRev" data-t="rev" data-tt="revT"></button>
     <button class="dim" id="btnCancel" data-t="cancel"></button>
    </div>
   </div>
  </div>

  <h2 data-t="hOut"></h2>
  <div class="card" id="outCard">
   <div id="outDiff" class="note"></div>
   <!-- Failų tekstas suskleistas: kasdien jo neprireikia (mygtukai „kopijuoti"
        ir „atsisiųsti" veikia ir suskleisto), o atverstas jis nustumia visa kita
        per du ekranus žemyn. -->
   <details id="outDet"><summary id="outSum"></summary>
   <div id="outWrap" style="display:none">
    <div class="row" style="border-top:0"><b id="outFileName"></b>
     <div class="acts"><button data-copy="file" data-t="copyB"></button><button data-dl="file" data-t="dlB"></button></div></div>
    <pre id="outFile"></pre>
    <div class="row"><b>manifest.json</b>
     <div class="acts"><button data-copy="man" data-t="copyB"></button><button data-dl="man" data-t="dlB"></button></div></div>
    <pre id="outMan"></pre>
    <div class="row"><b>links.json</b>
     <div class="acts"><button data-copy="links" data-t="copyB"></button><button data-dl="links" data-t="dlB"></button></div></div>
    <pre id="outLinks"></pre>
   </div>
   </details>
  </div>
 </div>
</div>

<p class="foot" data-th="foot"></p>
</div>

{const l=new URLSearchParams(location.search).get('lang');if(l==='en'||l==='lt')LANG=l;}

const dc=s=>LANG==='lt'?String(s).replace('.',','):String(s);   // lietuviškai - kablelis

const KEYS=['name','layer_height'].concat(F.map(f=>f.k)).concat(['tested_by','tested_on','buy_url']);

/* ---- pagalbinės ---------------------------------------------------------- */
const buyOk=u=>!u||u.indexOf('https://tinymakerwifi.com/')===0||u.indexOf('https://slibbinas.github.io/')===0;
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function num(v,dec,dmin){
  if(dec===0)return String(Math.round(v));
  let s=Number(v).toFixed(dec);
  if(dmin!==undefined){s=s.replace(/0+$/,'');if(s.slice(-1)==='.')s+='0';
    const d=s.split('.')[1]||'';if(d.length<dmin)s=Number(v).toFixed(dmin);}
  return s;
}
function fmt(k,v){
  if(k==='layer_height')return Number(v).toFixed(2);
  const f=F.find(x=>x.k===k);
  return f?num(v,f.dec,f.dmin):String(v);
}
/* Ribos žmogui - lietuviškai su kableliu ir tiek skaitmenų, kiek laukas realiai turi. */
const nh=(v,f)=>dc(f.dec===0?String(v):Number(v).toFixed(f.dmin||1));
/* Failas rašomas ranka, ne JSON.stringify: raktų tvarka ir skaičių užrašymas
   turi sutapti su jau publikuotais failais, kitaip „nieko nekeičiau" duotų
   kitokį failą, ir tikras pakeitimas pasimestų tarp kosmetinių. */
function profileText(p){
  const out=[];
  KEYS.forEach(k=>{
    const v=p[k];
    if(v===undefined||v===null||v==='')return;
    if(k==='name'||k==='tested_by'||k==='tested_on'||k==='buy_url')
      out.push('  "'+k+'": '+JSON.stringify(String(v)));
    else out.push('  "'+k+'": '+fmt(k,v));
  });
  return '{\n'+out.join(',\n')+'\n}\n';
}
function entryText(e,ind){
  const o=[];
  ['name','display','file'].forEach(k=>o.push('"'+k+'": '+JSON.stringify(e[k])));
  o.push('"layerHeight": '+Number(e.layerHeight).toFixed(2));
  ['testedBy','testedOn','buyUrl'].forEach(k=>{if(e[k])o.push('"'+k+'": '+JSON.stringify(e[k]));});
  ['since','why'].forEach(k=>{if(e[k])o.push('"'+k+'": '+JSON.stringify(e[k]));});
  if(typeof e.at==='number')o.push('"at": '+e.at);
  return ind+'{\n'+o.map(s=>ind+'  '+s).join(',\n')+'\n'+ind+'}';
}
/* Nuoroda gali buti ir objektas su `geo` - tada keiciam tik `url`, o salies
   israiskos lieka. Tekstas rasomas ranka del tos pacios priezasties, kaip
   manifestas: raktu tvarka turi sutapti su publikuotu failu. */
const NL='\n';
const shopOf=v=>(typeof v==='string'?v:(v&&v.url)||'');
const shopSet=(prev,url)=>(prev&&typeof prev==='object'&&prev.geo)
  ?Object.assign({},prev,{url:url}):url;
function linksText(L){
  if(!L)return '';
  const order=[];
  const push=n=>{if(L[n]!==undefined&&order.indexOf(n)<0)order.push(n);};
  man.profiles.forEach(e=>push(e.name));
  (man.hidden||[]).forEach(e=>push(e.name));
  (man.retired||[]).forEach(e=>push(e.name));
  Object.keys(L).forEach(k=>{if(k!=='_doc')push(k);});
  const out=[];
  if(L._doc)out.push('  "_doc": '+JSON.stringify(L._doc));
  order.forEach(n=>out.push('  '+JSON.stringify(n)+': '+JSON.stringify(L[n])));
  return '{' + NL + out.join(',' + NL) + NL + '}' + NL;
}
function manifestText(m){
  const part=(name,arr)=>'  "'+name+'": [\n'+arr.map(e=>entryText(e,'    ')).join(',\n')+'\n  ]';
  const blocks=['  "profiles": [\n'+m.profiles.map(e=>entryText(e,'    ')).join(',\n')+'\n  ]'];
  if(m.hidden&&m.hidden.length)blocks.push(part('hidden',m.hidden));
  if(m.retired&&m.retired.length)blocks.push(part('retired',m.retired));
  return '{\n'+blocks.join(',\n')+'\n}\n';
}
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');};
const todayFull=()=>{const d=new Date();return today()+'-'+String(d.getDate()).padStart(2,'0');};

/* ---- būsena -------------------------------------------------------------- */
const BUY='https://tinymakerwifi.com/r/';   // ka mato printeris (viskas, ka jis priima)
let man=null;          // darbinis manifestas (profiles/hidden/retired)
let live=null;         // kaip atrodo publikuotas manifestas dabar
let files={};          // slug -> publikuoto profilio objektas (palyginimui)
/* Kur is tikruju veda /r/<slug>. Atskiras failas, ne profilio laukas: printeris
   partnerio nuorodos nepriima, o pakeitus partneri niekas neperdiegineja profiliu.
   `null` reiskia „nepavyko parsisiusti" - tada links.json NERASOM, kitaip
   isvestis atrodytu kaip tvarkingas failas, o is tikruju istrintu visus esamus. */
let links=null;
let draft=null;        // {mode:'new'|'edit', slug0, p:{...}}
let libMsg=[];          // [[raktas,detalė]] - verčiama piešiant, kad kalbos perjungimas pagautų ir jį

function flash(m){
  const b=$('libBody');
  let d=b.querySelector('.flashMsg');
  if(!d){d=document.createElement('div');d.className='err flashMsg';b.insertBefore(d,b.firstChild);}
  d.textContent=m;
  setTimeout(()=>{if(d.isConnected)d.remove();},6000);
}
function save(){try{localStorage.setItem(LS,JSON.stringify({man:man,draft:draft,links:links,at:Date.now()}));}catch(e){}}
function wipe(){try{localStorage.removeItem(LS);}catch(e){}}

/* ---- biblioteka ---------------------------------------------------------- */
async function loadLib(keepLocal){
  libMsg=[];
  try{
    const r=await fetch(LIB+'manifest.json',{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    live={profiles:j.profiles||[],hidden:j.hidden||[],retired:j.retired||[]};
  }catch(e){
    live=null;libMsg.push(['libFail',e.message]);
  }
  if(!keepLocal||!man)man=live?JSON.parse(JSON.stringify(live)):{profiles:[],hidden:[],retired:[]};
  /* Nuorodos - kaip ir manifestas: parsisiunciam visada, bet vietinio darbo
     neuzklojam (kitaip puslapio perkrovimas tyliai atsuktu ka tik irasytas). */
  try{
    const r=await fetch(LIB+'links.json',{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    if(!keepLocal||!links)links=j;
  }catch(e){
    if(!keepLocal||!links)links=null;
    libMsg.push(['linksFail',e.message]);
  }
  renderLib();
}
async function fileOf(e){
  const key=e.name;
  if(files[key])return files[key];
  const r=await fetch(LIB+(e.file||(e.name+'.json')),{cache:'no-store'});
  if(!r.ok)throw new Error(t('fileFail',r.status));
  files[key]=await r.json();
  return files[key];
}
function rowEl(e,kind){
  const d=document.createElement('div');d.className='row';
  const nm=document.createElement('span');nm.className='nm';nm.textContent=e.display||e.name;
  d.appendChild(nm);
  const tags=document.createElement('span');
  tags.innerHTML='<span class="tag">'+dc(Number(e.layerHeight).toFixed(2))+' mm</span>'+
    (e.testedBy?' <span class="tag">✓ '+esc(e.testedBy)+(e.testedOn?', '+esc(e.testedOn):'')+'</span>':'')+
    (e.buyUrl&&!buyOk(e.buyUrl)?' <span class="tag no">'+t('tagNoBuy')+'</span>':'')+
    (kind!=='profiles'?' <span class="tag hid">'+t(kind==='hidden'?'tagHidden':'tagRetired')+' '+esc(e.since||'')+'</span>':'');
  d.appendChild(tags);
  const acts=document.createElement('div');acts.className='acts';
  const btn=(lbl,fn,cls)=>{const b=document.createElement('button');b.textContent=lbl;
    if(cls)b.className=cls;b.addEventListener('click',fn);acts.appendChild(b);return b;};
  if(kind==='profiles'){
    btn(t('bEdit'),()=>openEdit(e));
    btn(t('bCopy'),()=>openCopy(e));
    btn(t('bHide'),()=>hide(e,d),'dim');
  }else if(kind==='hidden'){
    btn(t('bUnhide'),()=>unhide(e),'pri');
    btn(t('bRetire'),()=>retire(e,d),'dim');
  }
  if(e.why){const w=document.createElement('span');w.className='sb';w.textContent=t('why',e.why);d.appendChild(w);}
  d.appendChild(acts);
  return d;
}
function renderLib(){
  const b=$('libBody');b.innerHTML='';
  if(libMsg.length){const w=document.createElement('div');w.className='warn';
    w.textContent=libMsg.map(m=>t(m[0],m[1])).join(' ');b.appendChild(w);}
  if(!man.profiles.length){const n=document.createElement('div');n.className='note';
    n.textContent=t('empty');b.appendChild(n);}
  man.profiles.forEach(e=>b.appendChild(rowEl(e,'profiles')));
  if(man.hidden&&man.hidden.length){
    const h=document.createElement('div');h.className='warn';
    h.textContent=t('hiddenHdr',man.hidden.length);
    b.appendChild(h);
    man.hidden.forEach(e=>b.appendChild(rowEl(e,'hidden')));
  }
  if(man.retired&&man.retired.length){
    const det=document.createElement('details');
    det.innerHTML='<summary>'+t('retiredHdr',man.retired.length)+'</summary>';
    man.retired.forEach(e=>det.appendChild(rowEl(e,'retired')));
    b.appendChild(det);
  }
  renderPending();
}
function renderPending(){
  const el=$('pending');el.innerHTML='';
  if(!live)return;
  const a=manifestText(live),c=manifestText(man);
  if(a===c){el.innerHTML='';return;}
  const d=document.createElement('div');d.className='card';d.style.marginTop='12px';
  const names=x=>x.profiles.map(e=>e.name);
  const was=names(live),now=names(man);
  const add=now.filter(n=>was.indexOf(n)<0),gone=was.filter(n=>now.indexOf(n)<0);
  d.innerHTML='<b style="font-size:.85rem">'+t('pending')+'</b>'+
    '<div class="note">'+(add.length?t('pAdd',add.join(', ')):'')+
    (gone.length?t('pGone',gone.join(', ')):'')+t('pTell')+'</div>';
  const btn=document.createElement('button');btn.className='dim';btn.textContent=t('discard');
  btn.style.marginTop='8px';
  /* Du paspaudimai vietoj confirm() - kad vienas nekantrus paspaudimas
     nenušluotų valandos darbo, bet ir nereikėtų svetimo langelio. */
  btn.addEventListener('click',()=>{
    if(btn.dataset.armed!=='1'){btn.dataset.armed='1';btn.textContent=t('discardQ');
      setTimeout(()=>{if(btn.isConnected){btn.dataset.armed='';btn.textContent=t('discard');}},4000);return;}
    man=JSON.parse(JSON.stringify(live));draft=null;wipe();renderLib();renderForm();showOut();});
  d.appendChild(btn);
  el.appendChild(d);
  showOut();
}

/* ---- veiksmai su biblioteka ---------------------------------------------- */
/* „at" - kelinta eilutė profilis stovėjo. Sąrašas rodomas manifesto tvarka, tad
   grąžinamas sustabdytas turi grįžti į savo vietą, o ne į galą: kitaip vienas
   laikinas paslėpimas tyliai pertvarko visą biblioteką. Pultas skaito tik
   .profiles, tad šis raktas jam neegzistuoja. */
function moveOut(e,to,why){
  const at=man.profiles.findIndex(x=>x.name===e.name);
  man.profiles=man.profiles.filter(x=>x.name!==e.name);
  const copy=Object.assign({},e,{since:todayFull(),why:why||''});
  if(to==='hidden'&&at>=0)copy.at=at;
  man[to]=(man[to]||[]).concat([copy]);
  save();renderLib();showOut();
}
/* Savas klausimas vietoj window.prompt: naršyklės langelis atrodo kaip svetimas
   („localhost:8899 says"), o priežastis čia yra dokumentas - ji lieka faile ir
   po mėnesio paaiškina, kodėl profilis kabo sustabdytas. */
function askReason(afterEl,text,def,okLabel,cb){
  const old=afterEl.parentNode.querySelector('.askRow');
  if(old)old.remove();
  const d=document.createElement('div');d.className='row askRow';
  d.style.cssText='background:var(--warnbg);border-radius:9px;padding:9px 11px;margin:4px 0';
  const q=document.createElement('span');q.className='sb';q.style.color='var(--warn)';q.textContent=text;
  const i=document.createElement('input');i.type='text';i.value=def;i.style.flex='1 1 190px';
  const ok=document.createElement('button');ok.className='pri';ok.textContent=okLabel;
  const no=document.createElement('button');no.className='dim';no.textContent=t('cancel');
  ok.addEventListener('click',()=>{const v=i.value.trim();d.remove();cb(v);});
  no.addEventListener('click',()=>d.remove());
  i.addEventListener('keydown',ev=>{if(ev.key==='Enter')ok.click();if(ev.key==='Escape')no.click();});
  d.appendChild(q);d.appendChild(i);
  const acts=document.createElement('div');acts.className='acts';
  acts.appendChild(ok);acts.appendChild(no);d.appendChild(acts);
  afterEl.parentNode.insertBefore(d,afterEl.nextSibling);
  i.focus();i.select();
}
function hide(e,rowEl){
  askReason(rowEl,t('hideQ'),t('hideDef'),t('bHide'),why=>moveOut(e,'hidden',why));
}
function retire(e,rowEl){
  askReason(rowEl,t('retireQ'),t('retireDef'),t('retireOk'),why=>{
    man.hidden=(man.hidden||[]).filter(x=>x.name!==e.name);
    man.retired=(man.retired||[]).concat([Object.assign({},e,{since:todayFull(),why:why})]);
    save();renderLib();showOut();
  });
}
function unhide(e){
  man.hidden=(man.hidden||[]).filter(x=>x.name!==e.name);
  const back=Object.assign({},e);
  const at=(typeof back.at==='number')?back.at:man.profiles.length;
  delete back.since;delete back.why;delete back.at;
  man.profiles.splice(Math.min(at,man.profiles.length),0,back);
  save();renderLib();showOut();
}

/* ---- forma --------------------------------------------------------------- */
function buildFields(){
  const g=$('fields');g.innerHTML='';
  F.forEach(f=>{
    const l=document.createElement('label');
    l.innerHTML='<b>'+fName(f)+(f.u?' <span style="color:var(--muted);font-weight:400">('+f.u+')</span>':'')+'</b>';
    const i=document.createElement('input');
    i.type='number';i.id='f_'+f.k;i.step=f.step;i.min=f.min;i.max=f.max;
    i.addEventListener('input',onEdit);
    l.appendChild(i);
    const h=document.createElement('span');h.style.cssText='font-size:.72rem;color:var(--muted)';
    h.textContent=nh(f.min,f)+' - '+nh(f.max,f);
    l.appendChild(h);
    g.appendChild(l);
  });
}
function setLh(v){
  draft.p.layer_height=Number(v);
  document.querySelectorAll('#lhSeg button').forEach(b=>b.classList.toggle('on',b.dataset.lh===Number(v).toFixed(2)));
  onEdit();
}
function renderForm(){
  const on=!!draft;
  ['fDisplay','fSlug','fTestedBy','fTestedOn','fShop','btnApply','btnRev','btnCancel'].forEach(id=>{
    const el=$(id);if(el)el.disabled=!on;});
  document.querySelectorAll('#fields input,#lhSeg button').forEach(el=>el.disabled=!on);
  $('formTitle').textContent=!on?t('form'):(draft.mode==='edit'?t('formEdit',draft.slug0):t('formNew'));
  $('btnRev').style.display=(on&&draft.mode==='edit')?'':'none';
  if(!on){$('formMsg').innerHTML='';return;}
  const p=draft.p;
  $('fDisplay').value=p.name||'';
  $('fSlug').value=draft.slug||'';
  $('fTestedBy').value=p.tested_by||'';
  $('fTestedOn').value=p.tested_on||'';
  $('fShop').value=draft.shop||'';
  F.forEach(f=>{const el=$('f_'+f.k);if(el)el.value=p[f.k];});
  document.querySelectorAll('#lhSeg button').forEach(b=>
    b.classList.toggle('on',b.dataset.lh===Number(p.layer_height).toFixed(2)));
  validate();
}
function collect(){
  const p=draft.p;
  p.name=$('fDisplay').value.trim();
  p.tested_by=$('fTestedBy').value.trim();
  p.tested_on=$('fTestedOn').value.trim();
  draft.shop=$('fShop').value.trim();
  /* Vardo iš principo atsisakyti negalima - kažkas turi vadintis failu ir kortelėje,
     ir pagal jį printeris sprendžia, ar profilį jau turi. Bet rankomis jo rašyti
     nereikia: kol nepalietei laukelio, jis seka pavadinimą. */
  if(draft.slugAuto){
    draft.slug=slugify(p.name);
    if($('fSlug').value!==draft.slug)$('fSlug').value=draft.slug;
  }else draft.slug=$('fSlug').value.trim();
  /* Nuoroda profilyje - masinerija: ji visada mūsų, ir ji visada seka varda.
     Zmogus rase ja ranka ir turejo pats prisiminti, kad vardui pasikeitus reikia
     pataisyti ir ja (revizija tai jau darė uz ji - dabar taip visur). */
  p.buy_url=draft.shop?BUY+draft.slug:'';
  F.forEach(f=>{const el=$('f_'+f.k);if(el&&el.value!=='')p[f.k]=Number(el.value);});
}
function onEdit(){collect();validate();save();showOut();}
/* Printerio gamykliniai profiliai. Toks vardas kortelėje nesukurtų naujo
   profilio, o užklotų gamyklinį (ResinProfile.ino: failas SD kortelėje yra
   built-in'o perdanga), ir bibliotekos sąraše jis net nepasirodytų - pultas
   siūlo tik tai, ko printeris dar neturi, o šituos jis turi visada. */
const RESERVED=['fast','slow'];
function validate(){
  const errs=[],warns=[],p=draft.p;
  let suggest=null;
  F.forEach(f=>{
    const el=$('f_'+f.k),v=p[f.k];
    const bad=!(typeof v==='number'&&isFinite(v))||v<f.min||v>f.max;
    if(el)el.classList.toggle('bad',bad);
    if(bad)errs.push(t('errRange',fName(f),nh(f.min,f),nh(f.max,f),t(f.mode==='clamp'?'whyClamp':'whySkip')));
  });
  const slug=draft.slug||'';
  if(!p.name)errs.push(t('needName'));
  if(!slug)errs.push(t('needSlug'));
  else if(slug!==slugify(slug)){
    errs.push(t('badSlug'));
    suggest=slugify(slug);
  }else if(RESERVED.indexOf(slug)>=0){
    errs.push(t('reserved',slug));
    suggest=slugify(p.name)&&RESERVED.indexOf(slugify(p.name))<0?slugify(p.name):slug+'-resin';
  }
  const clash=man.profiles.concat(man.hidden||[],man.retired||[]).some(e=>e.name===slug&&slug!==draft.slug0);
  if(clash){
    errs.push(t('clash'));
    if(!suggest)suggest=slug+'-2';
  }
  if(!p.tested_by)errs.push(t('needBy'));
  if(p.tested_on&&!/^\d{4}-\d{2}$/.test(p.tested_on))errs.push(t('badDate',today()));
  const shop=draft.shop||'';
  if(shop&&!/^https:\/\//.test(shop))
    errs.push(t('shopHttps'));
  if(shop&&shop.indexOf(BUY)===0)
    errs.push(t('shopSelf'));
  if(shop&&links===null)
    warns.push(t('linksMissing'));
  if(!shop)
    warns.push(t('noShop'));
  if(p.buy_url&&!buyOk(p.buy_url))
    warns.push(t('buyBad'));
  {const e=$('fBuyShow');
   if(e)e.textContent=shop?t('buyShow',BUY+(slug||t('slugWord'))):t('buyNone');}
  const box=$('formMsg');box.innerHTML='';
  errs.forEach(m=>{const d=document.createElement('div');d.className='err';d.textContent=m;box.appendChild(d);});
  if(suggest){
    const b=document.createElement('button');b.className='pri';b.style.marginTop='8px';
    b.textContent=t('useSlug',suggest);
    b.addEventListener('click',()=>{draft.slugAuto=false;$('fSlug').value=suggest;onEdit();});
    box.appendChild(b);
  }
  warns.forEach(m=>{const d=document.createElement('div');d.className='warn';d.textContent=m;box.appendChild(d);});
  $('btnApply').disabled=errs.length>0;
  $('btnRev').disabled=errs.length>0;
  return errs.length===0;
}
function openNew(){
  draft={mode:'new',slug:'',slug0:null,slugAuto:true,shop:'',
    p:Object.assign({},BASE,{name:'',tested_by:'TinyMakerWiFi',tested_on:today(),buy_url:''})};
  renderForm();save();showOut();
}
async function openEdit(e){
  try{
    const j=await fileOf(e);
    draft={mode:'edit',slug:e.name,slug0:e.name,slugAuto:false,
           shop:shopOf(links&&links[e.name]),p:Object.assign({},BASE,j)};
    renderForm();save();showOut();
  }catch(err){flash(err.message);}
}
async function openCopy(e){
  try{
    const j=await fileOf(e);
    const other=Number(j.layer_height)<0.075?'0.10':'0.05';
    const sfx=other==='0.10'?'-010':'-005';
    let slug=slugify(e.name.replace(/-0(05|10)$/,'')+sfx);
    draft={mode:'new',slug:slug,slug0:null,slugAuto:false,shop:shopOf(links&&links[e.name]),
           p:Object.assign({},BASE,j,{layer_height:Number(other)})};
    draft.p.name=(j.name||e.display)+' '+dc(other)+' mm';
    renderForm();save();showOut();
    const d=document.createElement('div');d.className='okbox';
    d.textContent=t('copyDone',dc(other));
    $('formMsg').appendChild(d);
  }catch(err){flash(err.message);}
}
function entryFromDraft(){
  const p=draft.p;
  const e={name:draft.slug,display:p.name,file:draft.slug+'.json',layerHeight:Number(p.layer_height)};
  if(p.tested_by)e.testedBy=p.tested_by;
  if(p.tested_on)e.testedOn=p.tested_on;
  if(p.buy_url)e.buyUrl=p.buy_url;
  return e;
}
function apply(){
  if(!validate())return;
  const e=entryFromDraft();
  const i=man.profiles.findIndex(x=>x.name===(draft.slug0||draft.slug));
  if(i>=0)man.profiles[i]=e;else man.profiles=man.profiles.concat([e]);
  /* Nuoroda irasoma TUO PACIU paspaudimu, kaip profilis. Atskirai jos rasyti
     nebuvo kur, tad /r/ adresas profilyje galejo isvaziuoti anksciau uz irasa
     links.json - ir „Buy" vestu i 404. */
  if(links){
    const old=draft.slug0;
    if(old&&old!==draft.slug)delete links[old];
    if(draft.shop)links[draft.slug]=shopSet(links[draft.slug],draft.shop);
    else delete links[draft.slug];
  }
  draft.slug0=draft.slug;draft.mode='edit';
  save();renderLib();renderForm();showOut();
}
function revision(){
  if(!validate())return;
  const old=draft.slug0;
  const m=/-r(\d+)$/.exec(old);
  const next=m?old.replace(/-r\d+$/,'-r'+(Number(m[1])+1)):old+'-r2';
  const oldEntry=man.profiles.filter(x=>x.name===old)[0];
  draft.slug=next;draft.slug0=null;draft.mode='new';draft.slugAuto=false;
  draft.p.tested_on=today();
  if(!/rev\)$/.test(draft.p.name))draft.p.name=draft.p.name+' ('+today()+' rev)';
  if(draft.shop)draft.p.buy_url=BUY+next;
  if(links&&draft.shop)links[next]=shopSet(links[old],draft.shop);
  if(oldEntry)moveOut(oldEntry,'retired',t('replacedBy',next));
  renderForm();
  const d=document.createElement('div');d.className='okbox';
  d.textContent=t('revDone',next);
  $('formMsg').appendChild(d);
  save();showOut();
}

/* ---- rezultatas ---------------------------------------------------------- */
let outFileTxt='',outManTxt='',outLinksTxt='',outFileName='manifest.json';
function diffLines(){
  if(!draft||draft.mode!=='edit')return [];
  const pub=files[draft.slug0];
  if(!pub)return [];
  const out=[];
  KEYS.forEach(k=>{
    const a=pub[k],b=draft.p[k];
    const sa=(a===undefined||a===null||a==='')?'-':(typeof a==='number'?fmt(k,a):String(a));
    const sb=(b===undefined||b===null||b==='')?'-':(typeof b==='number'?fmt(k,b):String(b));
    if(sa!==sb)out.push(k+': '+sa+' → '+sb);
  });
  return out;
}
function showOut(){
  outManTxt=manifestText(man);
  $('outMan').textContent=outManTxt;
  outLinksTxt=links?linksText(links):'';
  $('outLinks').textContent=outLinksTxt||t('linksOff');
  if(draft){
    outFileName=(draft.slug||t('profFile'))+'.json';
    outFileTxt=profileText(draft.p);
    $('outFileName').textContent=outFileName;
    $('outFile').textContent=outFileTxt;
    $('outWrap').style.display='';
    $('outSum').textContent=t('sumFile',outFileName)+(links?t('andLinks'):'');
    const d=diffLines();
    $('outDiff').className=d.length?'warn':'note';
    $('outDiff').textContent=draft.mode==='edit'
      ? (d.length?t('diff',d.join(' · ')):t('same'))
      : t('newProf');
  }else{
    $('outWrap').style.display=(man.profiles.length||man.hidden&&man.hidden.length)?'':'none';
    $('outSum').textContent=t(links?'sumBoth':'sumMan');
    $('outFile').textContent='';$('outFileName').textContent=t('noProf');
    outFileTxt='';
    $('outDiff').className='note';
    $('outDiff').textContent=t('pickAll');
  }
}
async function copyTxt(x){
  try{await navigator.clipboard.writeText(x);}
  catch(e){const ta=document.createElement('textarea');ta.value=x;document.body.appendChild(ta);
    ta.select();document.execCommand('copy');ta.remove();}
}
function download(name,txt){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));
  a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

/* ---- mygtukai ------------------------------------------------------------ */
$('btnNew').addEventListener('click',openNew);
$('btnCancel').addEventListener('click',()=>{draft=null;renderForm();save();showOut();});
$('btnApply').addEventListener('click',apply);
$('btnRev').addEventListener('click',revision);
$('btnReload').addEventListener('click',()=>{files={};loadLib(true);});
$('btnPaste').addEventListener('click',()=>{const b=$('pasteBox');b.style.display=b.style.display==='none'?'':'none';});
$('btnPasteCancel').addEventListener('click',()=>{$('pasteBox').style.display='none';});
$('btnPasteOk').addEventListener('click',()=>{
  let j;try{j=JSON.parse($('pasteTa').value);}catch(e){flash(t('notJson',e.message));return;}
  if(j.profiles){man={profiles:j.profiles,hidden:j.hidden||[],retired:j.retired||[]};
    if(!live)live=JSON.parse(JSON.stringify(man));
    $('pasteBox').style.display='none';save();renderLib();showOut();return;}
  draft={mode:'new',slug:slugify(j.name||''),slug0:null,slugAuto:false,
         shop:shopOf(links&&links[slugify(j.name||'')]),p:Object.assign({},BASE,j)};
  $('pasteBox').style.display='none';renderForm();save();showOut();
});
document.querySelectorAll('#lhSeg button').forEach(b=>
  b.addEventListener('click',()=>{if(draft)setLh(b.dataset.lh);}));
document.querySelectorAll('#langSeg button').forEach(b=>b.addEventListener('click',()=>{
  LANG=b.dataset.l;try{localStorage.setItem('tmLabLang',LANG);}catch(e){}
  history.replaceState(null,'',location.pathname);   // ?lang= nebeperrašytų pasirinkimo perkrovus
  applyStatic();buildFields();if(man){renderLib();renderForm();showOut();}}));
$('fSlug').addEventListener('input',()=>{if(draft)draft.slugAuto=false;});
['fDisplay','fSlug','fTestedBy','fTestedOn','fShop'].forEach(id=>$(id).addEventListener('input',onEdit));
const outOf=k=>k==='file'?outFileTxt:k==='links'?outLinksTxt:outManTxt;
const nameOf=k=>k==='file'?outFileName:k==='links'?'links.json':'manifest.json';
document.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',()=>{
  const x=outOf(b.dataset.copy);
  if(!x){b.textContent=t('nothing');setTimeout(()=>b.textContent=t('copyB'),1200);return;}
  copyTxt(x);b.textContent=t('copied');
  setTimeout(()=>b.textContent=t('copyB'),1200);}));
document.querySelectorAll('[data-dl]').forEach(b=>b.addEventListener('click',()=>{
  const k=b.dataset.dl,x=outOf(k);
  if(x)download(nameOf(k),x);}));

/* ---- startas ------------------------------------------------------------- */
applyStatic();buildFields();
$('libBody').textContent=t('loading');$('formTitle').textContent=t('form');$('outDiff').textContent=t('pick');
(async function(){
  let keep=null;
  try{keep=JSON.parse(localStorage.getItem(LS)||'null');}catch(e){}
  if(keep&&keep.man){man=keep.man;draft=keep.draft||null;}
  /* Nuorodu is atminties NEatkuriam kaip vienintelio saltinio: loadLib jas
     visada persikrauna, o cia tik uzpildom, kol jis dar nespejo. */
  if(keep&&keep.links)links=keep.links;
  await loadLib(!!(keep&&keep.man));
  /* Atėjus iš dervų testų (resin-lab, „→ Į biblioteką"): profilis su ištestuotomis
     reikšmėmis atidaromas kaip nauja derva. Perdavimas vienkartinis - kitaip
     kiekvienas puslapio perkrovimas vėl užklotų pradėtą darbą. */
  if(location.hash==='#lab'){
    let h=null;
    try{h=JSON.parse(localStorage.getItem('tmResinLabHandoff')||'null');localStorage.removeItem('tmResinLabHandoff');}catch(e){}
    if(h&&h.p){
      draft={mode:'new',slug:h.slug,slug0:null,slugAuto:false,
             shop:shopOf(links&&links[h.slug]),p:Object.assign({},BASE,h.p)};
      save();
    }
    history.replaceState(null,'',location.pathname+location.search);
  }
  renderForm();showOut();
})();
</script>
