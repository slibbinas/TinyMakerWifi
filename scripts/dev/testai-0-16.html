.t{display:grid;grid-template-columns:26px 1fr auto;gap:10px;padding:11px 14px;

.q b{display:block;margin-bottom:2px}

.act{display:flex;gap:6px}
.act button{padding:5px 10px;font-size:12px;min-width:34px}
.act button.on{border-color:var(--accent);color:var(--accent);font-weight:700}
.warn{border-left:3px solid var(--accent)}
.note{padding:10px 14px;color:var(--muted);font-size:12.5px;background:rgba(255,138,30,.06)}
textarea{width:100%;height:150px;margin-top:12px;background:var(--card);color:var(--text);

function render(){

 let n=0,done=0;

  const d=document.createElement('div'); d.className='grp';
  d.innerHTML='<h2>'+title+'</h2>';

   const id=gi+'-'+ii; n++; const st=S[id]||'';

   const row=document.createElement('div');
   row.className='t'+(st==='ok'?' ok':st==='bad'?' bad':'')+(q.indexOf('⚠️')>=0?' warn':'');

     '<div class="act"><button data-i="'+id+'" data-v="ok" class="'+(st==='ok'?'on':'')+'">✓</button>'+
     '<button data-i="'+id+'" data-v="bad" class="'+(st==='bad'?'on':'')+'">✗</button></div>';
   d.appendChild(row);
  });
  L.appendChild(d);
 });
 document.getElementById('cnt').textContent=done+' / '+n;
 L.querySelectorAll('button').forEach(b=>b.onclick=()=>{
   const i=b.dataset.i; S[i]=(S[i]===b.dataset.v)?'':b.dataset.v;
   localStorage.setItem('t016',JSON.stringify(S)); render();});
}

 localStorage.setItem('t016',JSON.stringify(S));render();}

 try{document.execCommand('copy');}catch(e){}
}
render();
