<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="theme.js"></script>
<style>
  :root{color-scheme:light dark;--bg:#1f1f22;--card:#2a2a2e;--text:#eee;--muted:#9a9aa2;--line:#3a3a40;--accent:#e8720c;--ok:#2fbf4f}
  @media(prefers-color-scheme:light){:root:not([data-theme]){--bg:#f2f2f4;--card:#fff;--text:#1f2124;--muted:#5f6570;--line:#dfe1e5;--ok:#2f8f4f}}
  :root[data-theme=light]{color-scheme:light;--bg:#f2f2f4;--card:#fff;--text:#1f2124;--muted:#5f6570;--line:#dfe1e5;--ok:#2f8f4f}
  :root[data-theme=dark]{color-scheme:dark;--bg:#1f1f22;--card:#2a2a2e;--text:#eee;--muted:#9a9aa2;--line:#3a3a40;--ok:#2fbf4f}
  body{font:13px -apple-system,Segoe UI,Roboto,sans-serif;padding:14px;min-width:320px;background:var(--bg);color:var(--text)}
  label{display:block;margin:14px 0 4px;color:var(--muted)}label:first-of-type{margin-top:0}
  input{width:100%;box-sizing:border-box;padding:6px 8px;margin:6px 0 4px;font:inherit;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:6px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{padding:6px 14px;background:var(--card);color:var(--text);border:0;border-right:1px solid var(--line);cursor:pointer;font:inherit}
  .seg button:last-child{border-right:0}
  .seg button.on{background:var(--accent);color:#fff}
  #save{margin-top:12px;padding:6px 14px;font:inherit;background:var(--accent);color:#fff;border:0;border-radius:6px;cursor:pointer}
  #msg{color:var(--ok);margin-left:8px}
  #msg.bad{color:#e05555}
  .hint{color:var(--muted);margin:6px 0 0;font-size:12px}
  .pin{background:var(--card);border:1px solid var(--accent);border-radius:8px;padding:8px 10px;margin:0 0 14px;line-height:1.45}
</style>
</head>
<body>
  <p class="pin" id="pin" hidden>&#128204; <b>Pin it to see the print on the toolbar:</b> click the puzzle icon &#129513; at the top right of Chrome, then the pin next to <b>TinyMaker status</b>.</p>
  <label>Theme</label>
  <div class="seg" id="themeSeg">
    <button data-m="system">System</button>
    <button data-m="light">Light</button>
    <button data-m="dark">Dark</button>
  </div>
  <label>Printer address (IP or name, e.g. 192.168.1.138 or tinymaker.local)</label>
  <input id="host" placeholder="tinymaker.local">
  <p class="hint">Save asks Chrome to let the extension read this one address - the printer on your network. It reads the print status and never changes anything.</p>
  <div><button id="save">Save</button><span id="msg"></span></div>
  <script src="common.js"></script>
  <script src="options.js"></script>
</body>
</html>
